<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#4c00ff">
    <title>BARSIDE CS2 — Поиск команды и турниры</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .loading-spinner { text-align: center; padding: 50px; }
        .role-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        .role-IGL { background: #ffd70020; color: #ffd700; border: 1px solid #ffd70040; }
        .role-AWP { background: #4caf5020; color: #4caf50; border: 1px solid #4caf5040; }
        .role-ENTRY { background: #ff980020; color: #ff9800; border: 1px solid #ff980040; }
        .role-RIFLER { background: #2196f320; color: #2196f3; border: 1px solid #2196f340; }
        .role-LURKER { background: #9c27b020; color: #9c27b0; border: 1px solid #9c27b040; }
        .notification-badge { background: #f44336; border-radius: 10px; padding: 2px 6px; font-size: 10px; margin-left: 5px; }
        .team-slot { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .team-slot.filled { background: rgba(76,0,255,0.15); border: 1px solid rgba(76,0,255,0.3); }
        .team-slot.empty { background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.2); }
        .lfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px; margin: 30px 0; }
        .tournaments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin: 30px 0; }
        @media (max-width: 768px) { .lfg-grid, .tournaments-grid { grid-template-columns: 1fr; } }
        .response-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 15px; margin-bottom: 12px; }
        .stars { display: inline-flex; gap: 4px; }
        .star { font-size: 20px; color: #555; cursor: pointer; }
        .star.active { color: #ffd700; }
        .weekday-schedule { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .weekday-item { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .weekday-name { width: 100px; font-weight: 600; color: var(--primary-light); }
        .weekday-input { flex: 1; min-width: 150px; background: rgba(255,255,255,0.05); border: 1px solid rgba(76,0,255,0.3); border-radius: 10px; padding: 10px 14px; color: white; }
        .compact-friend { padding: 10px 15px !important; }
        .compact-friend img { width: 40px !important; height: 40px !important; }
        .hero-section { background: linear-gradient(135deg, rgba(76,0,255,0.08), rgba(255,61,0,0.03)); }
        .admin-table { width: 100%; font-size: 13px; border-collapse: collapse; }
        .admin-table th, .admin-table td { padding: 10px; text-align: left; border-bottom: 1px solid #222; }
        .admin-table tr:hover td { background: rgba(76,0,255,0.05); cursor: pointer; }
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.1), rgba(255,255,255,0.05)); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .skeleton-card { height: 180px; margin-bottom: 16px; }
        .theme-toggle { background: rgba(255,255,255,0.05); border: 1px solid rgba(76,0,255,0.3); width: 36px; height: 36px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        body.light { --bg-primary: #f5f5f7; --bg-secondary: #ffffff; --bg-card: #ffffff; --text-primary: #111; --text-secondary: #555; --text-muted: #999; }
        body.light .form-input { background: #f0f0f0; color: #111; }
        body.light .team-slot.filled { background: rgba(76,0,255,0.1); }

        /* ===== INVENTORY ===== */
        .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
        .inv-item { background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.2) 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
        .inv-item:hover { transform: translateY(-4px); border-color: rgba(76,0,255,0.5); box-shadow: 0 8px 24px rgba(76,0,255,0.2); }
        .inv-img-wrap { position: relative; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .inv-img-wrap img { max-width: 100%; max-height: 90px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); transition: transform 0.3s; }
        .inv-item:hover .inv-img-wrap img { transform: scale(1.08); }
        .inv-qty { position: absolute; top: 0; right: 0; background: rgba(0,0,0,0.7); color: white; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
        .inv-name { font-size: 11px; font-weight: 600; line-height: 1.3; color: var(--text-primary); margin-bottom: 6px; min-height: 28px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .inv-rarity { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .inv-ext { font-size: 9px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; }
        .inv-tradable { position: absolute; top: 8px; left: 8px; font-size: 9px; background: rgba(76,175,80,0.25); color: #4caf50; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        body.light .inv-item { background: linear-gradient(180deg, #fff 0%, #f5f5f7 100%); border-color: rgba(0,0,0,0.08); }
        body.light .inv-name { color: #111; }
        @media (max-width: 768px) {
            .inv-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
            .inv-img-wrap { height: 70px; }
            .inv-img-wrap img { max-height: 70px; }
            #inv-search, #inv-rarity-filter, #inv-sort { width: 100% !important; }
        }

        /* ===== CHAT MEDIA ===== */
        #chat-recording { display: none; }
        #chat-recording span#rec-time { font-variant-numeric: tabular-nums; }
        audio { filter: invert(1) hue-rotate(180deg) brightness(0.8); border-radius: 20px; }
        body.light audio { filter: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
        #chat-upload-preview img { display: block; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <header class="header">
        <div class="header-content">
            <div class="flex" style="gap: 20px; align-items: center;">
                <a href="#home" class="logo" data-page="home">BARSIDE</a>
                <div class="online-indicator">
                    <div class="online-dot-header"></div>
                    <span class="online-label">онлайн</span>
                </div>
            </div>
            <div class="nav">
                <a href="#home" class="nav-link" data-page="home"><i class="fas fa-home"></i> Главная</a>
                <a href="#lfg" class="nav-link" data-page="lfg"><i class="fas fa-users"></i> Поиск <span id="response-badge" class="notification-badge" style="display:none;">0</span></a>
                <a href="#tournaments" class="nav-link" data-page="tournaments"><i class="fas fa-trophy"></i> Турниры</a>
                <a href="#teams" class="nav-link" data-page="teams"><i class="fas fa-shield-halved"></i> Команды</a>
                <a href="#friends" class="nav-link" data-page="friends"><i class="fas fa-user-friends"></i> Друзья <span id="unread-badge" class="notification-badge" style="display:none;">0</span></a>
                <a href="#admin" class="nav-link" data-page="admin" id="admin-link" style="display:none;"><i class="fas fa-shield-alt"></i> Админ</a>
                <button class="theme-toggle" onclick="toggleTheme()" title="Тема">🌙</button>
                <div id="auth-section"></div>
            </div>
        </div>
    </header>

    <div id="app" class="page-wrapper">
        <div class="container" style="padding-top:40px;">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>
    </div>

    <script>
        // ==================== КОНФИГ ====================
        const API_ROOT = `${window.location.origin}/api`;
        const AUTH_URL = `${API_ROOT}/auth/steam`;

        // ==================== ТЕМА ====================
        function applyTheme() {
            const t = localStorage.getItem('theme') || 'dark';
            document.body.classList.toggle('light', t === 'light');
            const b = document.querySelector('.theme-toggle');
            if (b) b.textContent = t === 'light' ? '☀️' : '🌙';
        }
        window.toggleTheme = function() {
            const c = localStorage.getItem('theme') || 'dark';
            localStorage.setItem('theme', c === 'dark' ? 'light' : 'dark');
            applyTheme();
        };

        // ==================== УТИЛИТЫ ====================
        function createFallbackAvatar(name) {
            const l = String(name || 'BS').trim().slice(0, 2).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4c00ff"/><stop offset="100%" stop-color="#ff3d00"/></linearGradient></defs><rect width="100%" height="100%" rx="64" fill="url(#g)"/><text x="50%" y="56%" font-size="42" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="700">${l}</text></svg>`;
            return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
        }
        function normalizeUser(u) {
            if (!u || typeof u !== 'object') return null;
            const steamId = u.steamId || u.steam_id || u.id || '';
            const id = u.id || u.userId || steamId || '';
            const displayName = u.displayName || u.display_name || u.nickname || u.steamNickname || u.steam_nickname || 'Игрок';
            const steamNickname = u.steamNickname || u.steam_nickname || displayName;
            const av = u.avatarUrl || u.avatar_url || u.steamAvatar || u.steam_avatar || createFallbackAvatar(displayName);
            return {
                ...u, id, steamId, steamNickname, displayName,
                steamAvatar: av, avatarUrl: av,
                bannerUrl: u.bannerUrl || u.banner_url || '',
                faceitUrl: u.faceitUrl || u.faceit_url || '',
                steamUrl: u.steamUrl || u.steam_url || '',
                rating: u.rating || 1000,
                matchesPlayed: u.matchesPlayed || u.matches_played || 0,
                title: u.title || 'Новичок',
                isAdmin: Boolean(u.isAdmin ?? u.is_admin),
                isBanned: Boolean(u.isBanned ?? u.is_banned)
            };
        }
        const avatarUrl = (u) => normalizeUser(u)?.steamAvatar || createFallbackAvatar('BS');
        const displayName = (u) => normalizeUser(u)?.displayName || 'Игрок';
        const steamNickname = (u) => normalizeUser(u)?.steamNickname || 'Игрок';

        function escapeHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        const formatTime = (d) => { try { return new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };
        const formatDate = (d) => { try { return new Date(d).toLocaleDateString('ru-RU'); } catch { return ''; } };
        const safeJsonParse = (v, f) => { try { return JSON.parse(v); } catch { return f; } };

        function showToast(msg, type = 'success', title = '') {
            const c = document.getElementById('toast-container');
            if (!c) return;
            const titles = { success: '✅', error: '❌', info: 'ℹ️' };
            const icons = { success: '✓', error: '✕', info: 'i' };
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.innerHTML = `<div class="toast-icon">${icons[type] || '✓'}</div><div class="toast-content"><div class="toast-title">${title || titles[type]}</div><div class="toast-message">${escapeHtml(msg)}</div></div><button class="toast-close">✕</button>`;
            c.appendChild(t);
            t.querySelector('.toast-close').onclick = () => t.remove();
            setTimeout(() => t.remove(), 4000);
        }
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.frequency.value = 800; g.gain.value = 0.05;
                o.connect(g); g.connect(ctx.destination); o.start();
                setTimeout(() => o.stop(), 100);
            } catch {}
        }
        function showLoading() {
            const a = document.getElementById('app');
            if (a) a.innerHTML = '<div class="container" style="padding-top:40px;"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>';
        }
        function showError(m) {
            const a = document.getElementById('app');
            if (a) a.innerHTML = `<div class="container"><div class="card text-center" style="color:#f44336;"><i class="fas fa-exclamation-triangle" style="font-size:48px; margin-bottom:16px;"></i><p>${escapeHtml(m)}</p><button class="btn btn-primary" style="margin-top:16px;" onclick="location.reload()">Обновить</button></div></div>`;
        }
        function customConfirm(msg) {
            return new Promise((resolve) => {
                const m = document.createElement('div');
                m.className = 'modal-overlay';
                m.innerHTML = `<div class="modal-content" style="max-width:400px;"><div class="modal-header"><h2 class="text-green">Подтверждение</h2><button class="modal-close" id="cc">✕</button></div><p style="margin-bottom:25px;">${escapeHtml(msg)}</p><div class="flex" style="justify-content:flex-end; gap:12px;"><button id="cn" class="btn" style="background:#555;">Отмена</button><button id="co" class="btn btn-primary">Да</button></div></div>`;
                document.body.appendChild(m);
                const close = () => m.remove();
                m.querySelector('#cc').onclick = () => { resolve(false); close(); };
                m.querySelector('#cn').onclick = () => { resolve(false); close(); };
                m.querySelector('#co').onclick = () => { resolve(true); close(); };
            });
        }

        // ==================== API ====================
        const api = {
            async request(method, url, payload = {}) {
                let path = String(url || '');
                if (path.startsWith('http')) path = new URL(path).pathname;
                if (path.startsWith('/api')) path = path.slice(4);
                if (!path.startsWith('/')) path = `/${path}`;
                const r = await fetch(`${API_ROOT}${path}`, {
                    method, credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: method === 'GET' || method === 'HEAD' ? undefined : JSON.stringify(payload || {})
                });
                const text = await r.text();
                let data = null;
                if (text) { try { data = JSON.parse(text); } catch { data = text; } }
                if (!r.ok) {
                    const err = new Error((data && data.error) || r.statusText);
                    err.response = { status: r.status, data };
                    throw err;
                }
                return { data };
            },
            get: (u) => api.request('GET', u),
            post: (u, d) => api.request('POST', u, d),
            put: (u, d) => api.request('PUT', u, d),
            delete: (u) => api.request('DELETE', u)
        };

        // ==================== СОСТОЯНИЕ ====================
        let currentUser = null;
        let currentPage = 'home';
        let renderToken = 0;
        let tournamentsCache = [];
        let responsesCache = {};
        let chatInterval = null;
        let sseConnection = null;
        let inventoryCache = { items: [], steamId: null };

        // ==================== НАВИГАЦИЯ ====================
        async function navigate(page, params = {}) {
            let targetPage = page;
            let url = `#${page}`;
            if (page === 'profile' && params.id) { targetPage = `profile/${params.id}`; url = `#profile/${params.id}`; }
            if (page === 'chat' && params.id) { targetPage = `chat/${params.id}`; url = `#chat/${params.id}`; }
            if (page === 'team' && params.id) { targetPage = `team/${params.id}`; url = `#team/${params.id}`; }
            if (page === 'lfg-create') { targetPage = 'lfg-create'; url = `#lfg/create`; }
            currentPage = targetPage;
            if (window.location.hash !== url) history.replaceState(null, '', url);
            await renderPage();
        }

        // ==================== АВТОРИЗАЦИЯ ====================
        async function loadAuth() {
            try {
                const res = await api.get('/auth/me');
                currentUser = normalizeUser(res.data?.data ?? null);
                updateAuthUI();
                if (currentUser) { loadUnreadCounts(); connectSSE(); }
            } catch { currentUser = null; updateAuthUI(); }
        }
        async function loadUnreadCounts() {
            if (!currentUser) return;
            try {
                const r = await api.get('/messages/unread/count');
                const b = document.getElementById('unread-badge');
                if (b) { const c = r.data?.count ?? 0; b.style.display = c > 0 ? 'inline' : 'none'; b.textContent = c; }
            } catch {}
            try {
                const r = await api.get('/lfg/responses/unread');
                const b = document.getElementById('response-badge');
                if (b) { const c = r.data?.count ?? 0; b.style.display = c > 0 ? 'inline' : 'none'; b.textContent = c; }
            } catch {}
        }
        function connectSSE() {
            if (!currentUser || sseConnection) return;
            try {
                sseConnection = new EventSource(`${API_ROOT}/events`);
                sseConnection.addEventListener('new-message', () => { loadUnreadCounts(); showToast('💬 Новое сообщение', 'info'); playBeep(); });
                sseConnection.addEventListener('new-response', () => { loadUnreadCounts(); showToast('📝 Новый отклик', 'info'); playBeep(); });
                sseConnection.addEventListener('friend-request', () => { loadUnreadCounts(); showToast('👥 Заявка в друзья', 'info'); playBeep(); });
                sseConnection.addEventListener('response-accepted', () => { showToast('✅ Ваш отклик принят!', 'success'); playBeep(); });
                sseConnection.addEventListener('team-invite', () => { showToast('🛡 Приглашение в команду', 'info'); playBeep(); });
                sseConnection.onerror = () => { sseConnection.close(); sseConnection = null; setTimeout(connectSSE, 5000); };
            } catch {}
        }
        function updateAuthUI() {
            const a = document.getElementById('auth-section');
            const al = document.getElementById('admin-link');
            if (!a) return;
            if (currentUser) {
                a.innerHTML = `<a href="#profile" class="profile-btn" id="profile-btn-link">
                    <img src="${avatarUrl(currentUser)}" class="profile-avatar-small" onerror="this.src='${createFallbackAvatar(displayName(currentUser))}'">
                    <span class="profile-name">${escapeHtml(displayName(currentUser))}</span>
                    <span class="profile-arrow">→</span>
                </a>`;
                document.getElementById('profile-btn-link').onclick = (e) => {
                    e.preventDefault();
                    navigate('profile', { id: currentUser.steamId });
                };
                if (al) al.style.display = currentUser.isAdmin ? 'flex' : 'none';
            } else {
                a.innerHTML = `<a href="${AUTH_URL}" class="btn btn-primary"><i class="fab fa-steam"></i> Войти</a>`;
                if (al) al.style.display = 'none';
            }
        }

        // ==================== РЕНДЕР ====================
        async function renderPage() {
            const myToken = ++renderToken;
            try {
                if (currentPage === 'home') await renderHome();
                else if (currentPage === 'lfg') await renderLfg();
                else if (currentPage === 'lfg-create' || currentPage === 'lfg/create') {
                    if (currentUser) renderLfgCreate(); else { currentPage = 'home'; await renderHome(); }
                }
                else if (currentPage === 'tournaments') await renderTournaments();
                else if (currentPage === 'teams') await renderTeams();
                else if (currentPage.startsWith('team/')) await renderTeam(currentPage.split('/')[1]);
                else if (currentPage === 'friends') await renderFriends();
                else if (currentPage === 'admin') {
                    if (currentUser?.isAdmin) await renderAdmin();
                    else showError('Доступ запрещён');
                }
                else if (currentPage.startsWith('profile/')) await renderProfile(currentPage.split('/')[1]);
                else if (currentPage.startsWith('chat/')) await renderChat(currentPage.split('/')[1]);
                else await renderHome();
            } catch (e) {
                console.error('Render error:', e);
                if (myToken === renderToken) showError('Ошибка: ' + e.message);
            }
        }

        // ==================== ГЛАВНАЯ ====================
        async function renderHome() {
            const res = await api.get('/stats');
            const s = res.data || {};
            document.getElementById('app').innerHTML = `<div class="container">
                <div class="hero-section" style="text-align:center; padding:60px 20px; border-radius:24px; margin-bottom:40px;">
                    <h1 style="font-size:48px; margin-bottom:20px; font-weight:800;">BARSIDE <span style="background:linear-gradient(135deg,#4caf50,#8bc34a); -webkit-background-clip:text; background-clip:text; color:transparent;">CS2</span></h1>
                    <p class="text-gray" style="font-size:18px; margin-bottom:30px;">Турниры, поиск тиммейтов и сообщество CS2</p>
                    <div class="flex" style="justify-content:center; gap:15px;">
                        <button class="btn btn-primary" onclick="navigate('tournaments')"><i class="fas fa-trophy"></i> Турниры</button>
                        <button class="btn btn-outline" onclick="navigate('lfg')"><i class="fas fa-users"></i> Найти команду</button>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-number">${s.totalUsers || 0}</div><div class="stat-label">Игроков</div></div>
                    <div class="stat-card"><div class="stat-number">${s.totalLfgPosts || 0}</div><div class="stat-label">Активных анкет</div></div>
                    <div class="stat-card"><div class="stat-number">${s.totalTournaments || 0}</div><div class="stat-label">Турниров</div></div>
                    <div class="stat-card"><div class="stat-number">${s.online || 0}</div><div class="stat-label">Онлайн</div></div>
                </div>
            </div>`;
        }

        // ==================== LFG ====================
        const LFG_ROLES = ['IGL', 'AWP', 'ENTRY', 'RIFLER', 'LURKER'];
        const WEEKDAY_LABELS = { monday: 'Пн', tuesday: 'Вт', wednesday: 'Ср', thursday: 'Чт', friday: 'Пт', saturday: 'Сб', sunday: 'Вс' };
        const getAcceptedPlayers = (p) => p.acceptedPlayers || p.accepted_players || [];
        const getAvailableRoles = (p) => LFG_ROLES.filter(r => (p.rolesNeeded || {})[r]);

        function formatLfgSchedule(post) {
            if (post.scheduleType !== 'weekly') return escapeHtml(post.schedule || 'По договоренности');
            const w = typeof post.weekSchedule === 'string' ? safeJsonParse(post.weekSchedule, {}) : (post.weekSchedule || {});
            const f = Object.entries(w).map(([d, v]) => v ? `${WEEKDAY_LABELS[d] || d}: ${escapeHtml(v)}` : '').filter(Boolean);
            return f.length ? f.join('<br>') : 'По дням';
        }

        async function loadInventory(steamId, force = false) {
            const c = document.getElementById('inv-container');
            const s = document.getElementById('inv-summary');
            if (!c) return;
            c.innerHTML = '<div class="skeleton skeleton-card" style="height:180px;"></div>';
            try {
                const res = await api.get(`/inventory/${steamId}${force ? '?force=1' : ''}`);
                const data = res.data || {};
                if (!data.success) {
                    const retryMin = data.retryAfterSeconds ? Math.ceil(data.retryAfterSeconds / 60) : 5;
                    const isRateLimit = data.error === 'rate_limited' || data.error === 'steam_blocked';
                    const icon = isRateLimit ? '⏳' : '🔒';
                    c.innerHTML = `<div style="text-align:center; padding:30px; color:#888;"><div style="font-size:48px; margin-bottom:12px;">${icon}</div><p style="margin-bottom:8px; max-width:520px; margin-left:auto; margin-right:auto; line-height:1.5;">${escapeHtml(data.message || 'Недоступно')}</p><div style="display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap;">${isRateLimit ? `<button class="btn btn-primary" id="inv-retry-btn" disabled>⏱ Повторить через <span id="inv-timer">${retryMin * 60}</span> сек</button>` : `<button class="btn btn-primary" onclick="loadInventory('${steamId}', true)">🔄 Попробовать снова</button>`}<button class="btn btn-outline" style="font-size:12px;" onclick="openInventoryDebug('${steamId}')">🔍 Диагностика</button></div></div>`;
                    if (isRateLimit) {
                        let remaining = retryMin * 60;
                        const timerEl = document.getElementById('inv-timer');
                        const btn = document.getElementById('inv-retry-btn');
                        const int = setInterval(() => {
                            remaining--;
                            if (timerEl) timerEl.textContent = remaining;
                            if (remaining <= 0) {
                                clearInterval(int);
                                if (btn) { btn.disabled = false; btn.innerHTML = '🔄 Попробовать снова'; btn.onclick = () => loadInventory(steamId, true); }
                            }
                        }, 1000);
                    }
                    if (s) s.textContent = '';
                    return;
                }
                inventoryCache = { items: data.items || [], steamId };
                const badge = data.stale ? '· <span style="color:#ff9800;">устаревшие</span>' : data.cached ? '· <span style="color:#ffd700;">кеш</span>' : '· <span style="color:#4caf50;">свежие</span>';
                if (s) s.innerHTML = `Всего: <b>${data.total}</b> · Уникальных: <b>${inventoryCache.items.length}</b> ${badge}`;
                filterInventory();
            } catch (e) {
                c.innerHTML = `<div style="text-align:center; padding:30px; color:#f44336;">Ошибка: ${escapeHtml(e.message)}</div>`;
            }
        }

        window.filterInventory = function() {
            const c = document.getElementById('inv-container');

            const search = (document.getElementById('inv-search')?.value || '').toLowerCase();

            if (search) items = items.filter(i => i.name.toLowerCase().includes(search) || (i.weapon || '').toLowerCase().includes(search));
            if (rar) items = items.filter(i => i.rarity === rar);
            if (sort === 'rarity') items.sort((a, b) => (b.rarityRank - a.rarityRank) || a.name.localeCompare(b.name));
            else if (sort === 'name') items.sort((a, b) => a.name.localeCompare(b.name));
            else if (sort === 'type') items.sort((a, b) => (a.type || '').localeCompare(b.type || '') || a.name.localeCompare(b.name));

        // ==================== ЧАТ ====================
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordingTimer = null;
        let recordingSeconds = 0;
        let pendingAttachment = null;

        async function renderChat(userId) {
            if (!currentUser) { navigate('home'); return; }
            if (chatInterval) { clearInterval(chatInterval); chatInterval = null; }
            if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
            if (mediaRecorder && mediaRecorder.state === 'recording') { try { mediaRecorder.stop(); } catch {} }
            pendingAttachment = null;

            showLoading();
            const uR = await api.get(`/user/by-id/${userId}`);
            const cu = uR.data?.user;
            if (!cu) throw new Error('Not found');
            const mR = await api.get(`/messages/${userId}`);
            const messages = mR.data?.data || [];

            document.getElementById('app').innerHTML = `<div class="container" style="max-width:800px; margin:0 auto;">
                <div class="card" style="margin-bottom:20px; display:flex; align-items:center; gap:15px;">
                    <button class="btn" style="background:#555; padding:8px 12px;" onclick="navigate('friends')">←</button>
                    <img src="${avatarUrl(cu)}" style="width:48px; height:48px; border-radius:50%;">
                    <div style="flex:1;"><h3>${escapeHtml(displayName(cu))}</h3></div>
                </div>
                <div class="card" style="height:520px; display:flex; flex-direction:column;">
                    <div id="chat-messages" style="flex:1; overflow-y:auto; padding:16px;">${renderMessagesHtml(messages, currentUser.id)}</div>
                    <div id="chat-upload-preview" style="padding:0 12px 8px; display:none;"></div>
                    <div id="chat-recording" style="padding:0 12px 8px; display:none; align-items:center; gap:10px;">
                        <div style="width:10px; height:10px; border-radius:50%; background:#f44336; animation:pulse 1s infinite;"></div>
                        <span class="text-gray" style="font-size:13px;">Запись... <span id="rec-time">0:00</span></span>
                        <button type="button" class="btn" style="background:#f44336; padding:4px 10px; font-size:12px; margin-left:auto;" id="chat-stop-rec">Стоп</button>
                    </div>
                    <form id="chat-form" style="display:flex; gap:8px; padding:12px; border-top:1px solid rgba(76,0,255,0.2); align-items:center;">
                        <input type="file" id="chat-file" accept="image/*" style="display:none;">
                        <button type="button" class="btn btn-outline" id="chat-attach-btn" title="Фото" style="padding:8px 12px; font-size:16px;">📎</button>
                        <button type="button" class="btn btn-outline" id="chat-voice-btn" title="Голосовое" style="padding:8px 12px; font-size:16px;">🎤</button>
                        <input type="text" id="chat-input" class="form-input" style="flex:1;" placeholder="Сообщение...">
                        <button type="submit" class="btn btn-primary">📤</button>
                    </form>
                </div>
            </div>`;

            const c = document.getElementById('chat-messages');
            if (c) c.scrollTop = c.scrollHeight;
            bindChatMediaHandlers();
            document.getElementById('chat-form').onsubmit = async (e) => {
                e.preventDefault();
                const i = document.getElementById('chat-input');
                const t = i.value.trim();
                if (!t && !pendingAttachment) return;
                try {
                    const payload = { text: t };
                    if (pendingAttachment) {
                        payload.attachmentType = pendingAttachment.type;
                        payload.attachmentUrl = pendingAttachment.url;
                        payload.attachmentName = pendingAttachment.name;
                        payload.attachmentSize = pendingAttachment.size;
                        payload.attachmentDuration = pendingAttachment.duration || null;
                    }
                    await api.post(`/messages/${userId}`, payload);
                    i.value = '';
                    clearPendingAttachment();
                    const nr = await api.get(`/messages/${userId}`);
                    const d = document.getElementById('chat-messages');
                    if (d) { d.innerHTML = renderMessagesHtml(nr.data?.data || [], currentUser.id); d.scrollTop = d.scrollHeight; }
                } catch (e) { showToast(e.response?.data?.error || 'Ошибка', 'error'); }
            };
            chatInterval = setInterval(async () => {
                if (currentPage === `chat/${userId}`) {
                    try {
                        const nr = await api.get(`/messages/${userId}`);
                        const d = document.getElementById('chat-messages');
                        if (d) d.innerHTML = renderMessagesHtml(nr.data?.data || [], currentUser.id);
                    } catch {}
                } else { clearInterval(chatInterval); chatInterval = null; }
            }, 5000);
        }

        function renderMessagesHtml(messages, uid) {
            if (!messages || messages.length === 0) return '<div class="text-center" style="padding:40px;">Нет сообщений</div>';
            return messages.map(m => {
                const o = m.fromId === uid;
                const at = m.attachmentType;
                const au = m.attachmentUrl;
                let att = '';
                if (au && at === 'image') {
                    att = `<img src="${escapeHtml(au)}" style="max-width:100%; max-height:320px; border-radius:12px; margin-bottom:6px; cursor:pointer; display:block;" onclick="openImageViewer('${escapeHtml(au)}')">`;
                } else if (au && at === 'audio') {
                    const dur = m.attachmentDuration ? `${Math.floor(m.attachmentDuration / 60)}:${String(m.attachmentDuration % 60).padStart(2, '0')}` : '';
                    att = `<div style="display:flex; align-items:center; gap:10px; margin-bottom:6px; min-width:220px;"><span style="font-size:22px;">🎤</span><audio controls src="${escapeHtml(au)}" style="max-width:200px; height:36px;"></audio>${dur ? `<span style="font-size:11px; color:rgba(255,255,255,0.5);">${dur}</span>` : ''}</div>`;
                } else if (au) {
                    att = `<a href="${escapeHtml(au)}" target="_blank" style="display:flex; align-items:center; gap:6px; margin-bottom:6px; color:inherit; font-size:13px;">📎 ${escapeHtml(m.attachmentName || 'Файл')}</a>`;
                }
                const txt = m.text ? `<p style="font-size:13px; margin-bottom:4px; word-break:break-word;">${escapeHtml(m.text)}</p>` : '';
                return `<div style="text-align:${o ? 'right' : 'left'}; margin-bottom:15px;"><div style="display:inline-block; background:${o ? 'var(--primary)' : 'rgba(255,255,255,0.08)'}; padding:10px 14px; border-radius:16px; max-width:75%;">${att}${txt}<p style="font-size:9px; color:rgba(255,255,255,0.4); margin-top:2px;">${formatTime(m.createdAt)}</p></div></div>`;
            }).join('');
        }

        function bindChatMediaHandlers() {
            const attachBtn = document.getElementById('chat-attach-btn');
            const fileInput = document.getElementById('chat-file');
            const voiceBtn = document.getElementById('chat-voice-btn');
            const stopRecBtn = document.getElementById('chat-stop-rec');
            if (attachBtn) attachBtn.onclick = () => fileInput.click();
            if (voiceBtn) voiceBtn.onclick = startRecording;
            if (stopRecBtn) stopRecBtn.onclick = stopRecording;
            if (fileInput) fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                fileInput.value = '';
                await uploadAndPreview(file);
            };
        }

        async function uploadAndPreview(file) {
            const preview = document.getElementById('chat-upload-preview');
            if (!preview) return;
            preview.style.display = 'block';
            preview.innerHTML = `<div style="background:rgba(76,0,255,0.15); padding:10px; border-radius:10px;"><span class="text-gray">Загрузка...</span></div>`;
            try {
                const fd = new FormData();
                fd.append('file', file);
                const r = await fetch(`${API_ROOT}/upload`, { method: 'POST', credentials: 'include', body: fd });
                const data = await r.json();
                if (!r.ok) throw new Error(data.error || 'Ошибка');
                pendingAttachment = { url: data.url, type: data.type, name: data.name, size: data.size, duration: null };
                const isImage = data.type === 'image';
                preview.innerHTML = `<div style="background:rgba(76,0,255,0.15); padding:10px; border-radius:10px; display:flex; align-items:center; gap:10px;">
                    ${isImage ? `<img src="${data.url}" style="width:60px; height:60px; object-fit:cover; border-radius:8px;">` : `<span style="font-size:28px;">🎤</span>`}
                    <div style="flex:1;"><div style="font-size:13px;">${escapeHtml(data.name)}</div><div class="text-gray" style="font-size:11px;">${(data.size / 1024).toFixed(1)} КБ</div></div>
                    <button type="button" class="btn" style="background:#f44336; padding:4px 10px; font-size:12px;" onclick="clearPendingAttachment()">✕</button>
                </div>`;
            } catch (e) {
                preview.innerHTML = `<div style="background:rgba(244,67,54,0.15); padding:10px; border-radius:10px; color:#f44336; font-size:13px;">${escapeHtml(e.message)}</div>`;
                setTimeout(() => { preview.style.display = 'none'; }, 4000);
            }
        }
        window.clearPendingAttachment = function() {
            pendingAttachment = null;
            const p = document.getElementById('chat-upload-preview');
            if (p) { p.style.display = 'none'; p.innerHTML = ''; }
        };
        async function startRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recordedChunks = [];
                recordingSeconds = 0;
                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
                mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    const duration = recordingSeconds;
                    const blob = new Blob(recordedChunks, { type: mimeType || 'audio/webm' });
                    const file = new File([blob], `voice_${Date.now()}.webm`, { type: blob.type });
                    await uploadAndPreview(file);
                    if (pendingAttachment) pendingAttachment.duration = duration;
                    recordingSeconds = 0;
                };
                mediaRecorder.start();
                const recDiv = document.getElementById('chat-recording');
                const recTime = document.getElementById('rec-time');
                if (recDiv) recDiv.style.display = 'flex';
                recordingTimer = setInterval(() => {
                    recordingSeconds++;
                    if (recTime) recTime.textContent = `${Math.floor(recordingSeconds / 60)}:${String(recordingSeconds % 60).padStart(2, '0')}`;
                    if (recordingSeconds >= 300) stopRecording();
                }, 1000);
            } catch (e) { showToast('Нет доступа к микрофону: ' + e.message, 'error'); }
        }
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
            const recDiv = document.getElementById('chat-recording');
            if (recDiv) recDiv.style.display = 'none';
        }
        window.openImageViewer = function(url) {
            const m = document.createElement('div');
            m.className = 'modal-overlay';
            m.style.zIndex = '10001';
            m.innerHTML = `<img src="${escapeHtml(url)}" style="max-width:90vw; max-height:90vh; border-radius:12px;">`;
            m.onclick = () => m.remove();
            document.body.appendChild(m);
        };

        // ==================== АДМИН ====================
        async function renderAdmin() {
            if (!currentUser?.isAdmin) { showError('Доступ запрещён'); return; }
            showLoading();
            const res = await api.get('/admin/users');
            const users = res.data?.data || [];
            const rows = users.map(u => `<tr><td onclick="navigate('profile',{id:'${u.steamId}'})"><div style="display:flex; align-items:center; gap:8px;"><img src="${avatarUrl(u)}" style="width:28px; height:28px; border-radius:50%;">${escapeHtml(displayName(u))}</div></td><td>${u.isAdmin ? '👑' : '👤'}</td><td>${u.isBanned ? '🔴' : '🟢'}</td><td>${escapeHtml(u.region || '—')}</td><td>${formatDate(u.createdAt)}</td><td onclick="event.stopPropagation();"><button class="btn" style="padding:4px 8px; font-size:11px; background:${u.isAdmin ? '#f44336' : '#4caf50'};" onclick="adminToggle('${u.id}','promote',${!u.isAdmin})">${u.isAdmin ? '−' : '+'}👑</button><button class="btn" style="padding:4px 8px; font-size:11px; background:${u.isBanned ? '#4caf50' : '#f44336'}; margin-left:4px;" onclick="adminToggle('${u.id}','ban',${!u.isBanned})">${u.isBanned ? 'Разбан' : 'Бан'}</button></td></tr>`).join('');
            document.getElementById('app').innerHTML = `<div class="container"><h1 style="margin-bottom:20px;">👑 Админ-панель</h1><div class="card"><div style="display:flex; justify-content:space-between; align-items:center;"><h2 class="text-green">Пользователи (${users.length})</h2><button class="btn btn-outline" onclick="renderPage()">🔄</button></div><div style="overflow-x:auto; margin-top:15px;"><table class="admin-table"><thead><tr><th>Ник</th><th>Адм</th><th>Бан</th><th>Регион</th><th>Создан</th><th>Действия</th></tr></thead><tbody>${rows || '<tr><td colspan="6" style="text-align:center; padding:20px;">Пусто</td></tr>'}</tbody></table></div></div></div>`;
        }
        window.adminToggle = async function(uid, action, value) {
            try {
                const url = action === 'ban' ? `/admin/ban/${uid}` : `/admin/promote/${uid}`;
                const body = action === 'ban' ? { ban: value } : { promote: value };
                await api.post(url, body); showToast('OK', 'success'); renderAdmin();
            } catch { showToast('Ошибка', 'error'); }
        };

        // ==================== ДЕЙСТВИЯ ====================
        window.showRespondModal = function(pid, roles) {
            const btns = roles.map(r => `<button class="btn btn-outline" style="margin:5px;" onclick="respondToLfg('${pid}','${r}')">${r}</button>`).join('');
            const m = document.createElement('div');
            m.className = 'modal-overlay';
            m.innerHTML = `<div class="modal-content" style="max-width:400px;"><div class="modal-header"><h2 class="text-green">Роль</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div><div style="text-align:center; padding:20px;">${btns}</div></div>`;
            document.body.appendChild(m);
        };
        window.respondToLfg = async function(pid, role) {
            document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
            try { await api.post(`/lfg/${pid}/respond`, { role }); showToast('Отклик', 'success'); renderPage(); }
            catch (e) { showToast(e.response?.data?.error || 'Ошибка', 'error'); }
        };
        window.loadResponses = async function(pid) {
            try { const r = await api.get(`/lfg/${pid}/responses`); responsesCache[pid] = r.data?.data || []; renderPage(); }
            catch { showToast('Ошибка', 'error'); }
        };
        window.acceptResponse = async function(pid, rid) {
            try { await api.post(`/lfg/${pid}/responses/${rid}/accept`); showToast('Принят', 'success'); renderPage(); }
            catch (e) { showToast(e.response?.data?.error || 'Ошибка', 'error'); }
        };
        window.rejectResponse = async function(pid, rid) {
            try { await api.post(`/lfg/${pid}/responses/${rid}/reject`); showToast('OK', 'info'); renderPage(); }
            catch { showToast('Ошибка', 'error'); }
        };
        window.deleteLfgPost = async function(pid) {
            if (await customConfirm('Удалить?')) {
                try { await api.delete(`/lfg/${pid}`); showToast('Удалено', 'success'); renderPage(); }
                catch { showToast('Ошибка', 'error'); }
            }
        };
        window.showCompleteLfgModal = function(pid) {
            const m = document.createElement('div');
            m.className = 'modal-overlay';
            m.innerHTML = `<div class="modal-content" style="max-width:440px;"><div class="modal-header"><h2 class="text-green">Завершить</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div><div class="form-group"><label>Оценка</label><div class="stars" id="review-stars">${[1, 2, 3, 4, 5].map(s => `<span class="star" data-value="${s}">★</span>`).join('')}</div></div><div class="form-group"><label>Комментарий</label><textarea class="form-input" id="review-comment" rows="3" maxlength="200"></textarea></div><div class="flex" style="justify-content:flex-end; gap:10px;"><button class="btn" style="background:#555;" onclick="this.closest('.modal-overlay').remove()">Отмена</button><button class="btn btn-primary" id="clb">Завершить</button></div></div>`;
            document.body.appendChild(m);
            let rating = 0;
            m.querySelectorAll('.star').forEach(s => { s.onclick = () => { rating = parseInt(s.dataset.value, 10); m.querySelectorAll('.star').forEach(x => x.classList.toggle('active', parseInt(x.dataset.value, 10) <= rating)); }; });
            m.querySelector('#clb').onclick = async () => {
                const comment = m.querySelector('#review-comment').value.trim();
                if (!rating || !comment) { showToast('Оценка и комментарий', 'error'); return; }
                try { await api.post(`/lfg/${pid}/complete`); await api.post(`/lfg/${pid}/review`, { rating, comment }); m.remove(); showToast('Завершено!', 'success'); renderPage(); }
                catch (e) { showToast(e.response?.data?.error || 'Ошибка', 'error'); }
            };
        };
        window.sendFriendRequest = async function(uid) {
            try { await api.post(`/friends/request/${uid}`); showToast('Заявка', 'success'); }
            catch (e) { showToast(e.response?.data?.error || 'Ошибка', 'error'); }
        };
        window.acceptFriendRequest = async function(id) { try { await api.post(`/friends/request/${id}/accept`); showToast('OK', 'success'); renderPage(); } catch { showToast('Ошибка', 'error'); } };
        window.declineFriendRequest = async function(id) { try { await api.post(`/friends/request/${id}/decline`); showToast('OK', 'info'); renderPage(); } catch { showToast('Ошибка', 'error'); } };
        window.cancelFriendRequest = async function(id) { if (await customConfirm('Отменить?')) { try { await api.delete(`/friends/request/${id}`); renderPage(); } catch {} } };
        window.removeFriend = async function(fid) { if (await customConfirm('Удалить?')) { try { await api.delete(`/friends/${fid}`); renderPage(); } catch {} } };
        window.showFriendsTab = function(tab) {
            ['friends', 'requests', 'sent'].forEach(t => { const e = document.getElementById(`friends-tab-${t}`); if (e) e.style.display = t === tab ? 'block' : 'none'; });
            const btns = document.querySelectorAll('.container > .flex > button');
            btns.forEach((b, i) => { const a = (tab === 'friends' && i === 0) || (tab === 'requests' && i === 1) || (tab === 'sent' && i === 2); b.className = a ? 'btn btn-primary' : 'btn btn-outline'; });
        };

        // ==================== НАВИГАЦИЯ ОБРАБОТЧИКИ ====================
        function attachNavigationEvents() {
            document.querySelectorAll('[data-page]').forEach(el => {
                if (el._navBound) return;
                el._navBound = true;
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.getAttribute('data-page');
                    navigate(page);
                });
            });
        }

        // ==================== INIT ====================
        async function init() {
            applyTheme();
            attachNavigationEvents();
            await loadAuth();
            currentPage = window.location.hash.replace(/^#/, '') || 'home';
            await renderPage();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        init();
    </script>
</body>
</html>
