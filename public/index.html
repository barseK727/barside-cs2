            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<div class="toast-icon">${icons[type] || '✓'}</div><div class="toast-content"><div class="toast-title">${title || titles[type]}</div><div class="toast-message">${message}</div></div><button class="toast-close">✕</button>`;
            container.appendChild(toast);
            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.onclick = () => { toast.style.animation = 'slideOutRight 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); };
            setTimeout(() => { if (toast.parentNode) { toast.style.animation = 'slideOutRight 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); } }, 4000);
        }

        function formatTime(dateStr, withoutSeconds = true) {
            try { const date = new Date(dateStr); return withoutSeconds ? date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : date.toLocaleString(); } 
            catch(e) { return ''; }
        }
        
        function formatRelativeTime(dateStr) {
            try {
                const date = new Date(dateStr);
                const now = new Date();
                const diffMins = Math.floor((now - date) / 60000);
                const diffHours = Math.floor(diffMins / 60);
                const diffDays = Math.floor(diffHours / 24);
                if (diffMins < 1) return 'только что';
                if (diffMins < 60) return `${diffMins} мин назад`;
                if (diffHours < 24) return `${diffHours} ч назад`;
                return `${diffDays} д назад`;
            } catch(e) { return ''; }
        }

        // ==================== СТРАНИЦА LFG С ОТКЛИКАМИ ====================
        function LfgPage({ navigate }) {
            const { user } = useAuth();
            const [posts, setPosts] = React.useState([]);
            const [completedPosts, setCompletedPosts] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [showForm, setShowForm] = React.useState(false);

            const [responses, setResponses] = React.useState({});

            const [reviewData, setReviewData] = React.useState({ rating: 0, comment: '' });

            const [scheduleType, setScheduleType] = React.useState('daily');

            const [weekSchedule, setWeekSchedule] = React.useState({

            const [charCount, setCharCount] = React.useState({ daily: 0, weekly: { monday: 0, tuesday: 0, wednesday: 0, thursday: 0, friday: 0, saturday: 0, sunday: 0 } });
            const [formData, setFormData] = React.useState({

            // Функция для скролла к успешным анкетам

            ];
            
            const regionOptions = [
