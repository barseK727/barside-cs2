<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BARSIDE CS2 - Поиск команды и турниры</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <style>
        .page { display: none; }
        .page.active { display: block; }
        .loading-spinner { text-align: center; padding: 50px; }
        .loading-spinner i { font-size: 48px; color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .role-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        .role-IGL { background: #ffd70020; color: #ffd700; border: 1px solid #ffd70040; }
        .role-AWP { background: #4caf5020; color: #4caf50; border: 1px solid #4caf5040; }
        .role-ENTRY { background: #ff980020; color: #ff9800; border: 1px solid #ff980040; }
        .role-RIFLER { background: #2196f320; color: #2196f3; border: 1px solid #2196f340; }
        .role-LURKER { background: #9c27b020; color: #9c27b0; border: 1px solid #9c27b040; }
        .notification-badge { background: #f44336; border-radius: 10px; padding: 2px 6px; font-size: 10px; margin-left: 5px; animation: pulse 1s infinite; }
        .team-slot { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .team-slot.filled { background: rgba(76,0,255,0.15); border: 1px solid rgba(76,0,255,0.3); }
        .team-slot.empty { background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.2); }
        .lfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px; margin: 30px 0; }
        .tournaments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin: 30px 0; }
        @media (max-width: 768px) { .lfg-grid, .tournaments-grid { grid-template-columns: 1fr; } }
        .response-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 15px; margin-bottom: 12px; }
        .response-card:hover { background: rgba(255,255,255,0.06); }
        .stars { display: inline-flex; gap: 4px; cursor: pointer; }
        .star { font-size: 20px; color: #555; cursor: pointer; transition: color 0.1s; }
        .star.active { color: #ffd700; }
        .custom-select { position: relative; width: 100%; }
        .custom-select-trigger { background: rgba(255,255,255,0.05); border: 1px solid rgba(76,0,255,0.3); border-radius: 14px; padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .custom-select-trigger:hover { border-color: var(--primary); }
        .custom-select-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a24; border: 1px solid rgba(76,0,255,0.3); border-radius: 14px; margin-top: 5px; z-index: 100; max-height: 250px; overflow-y: auto; display: none; }
        .custom-select.open .custom-select-dropdown { display: block; }
        .custom-select-option { padding: 12px 18px; cursor: pointer; transition: background 0.2s; }
        .custom-select-option:hover { background: rgba(76,0,255,0.15); }
        .custom-select-option.selected { background: rgba(76,0,255,0.3); color: var(--primary-light); }
        .weekday-schedule { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .weekday-item { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .weekday-name { width: 100px; font-weight: 600; color: var(--primary-light); }
        .weekday-input { flex: 1; min-width: 150px; background: rgba(255,255,255,0.05); border: 1px solid rgba(76,0,255,0.3); border-radius: 10px; padding: 10px 14px; color: white; }
        .weekday-input:focus { outline: none; border-color: var(--primary); }
        .char-counter { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 4px; }
        .char-counter.warning { color: #ff9800; }
        .char-counter.danger { color: #f44336; }
        .compact-friend { padding: 10px 15px !important; }
        .compact-friend img { width: 40px !important; height: 40px !important; }
        .clickable { cursor: pointer; transition: opacity 0.2s; }
        .clickable:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    
    <header class="header">
        <div class="header-content">
            <div class="flex" style="gap: 20px; align-items: center;">
                <a href="#" class="logo" data-page="home">BARSIDE</a>
                <div class="online-indicator">
                    <div class="online-dot-header"></div>
                    <span class="online-count" id="online-count">0</span>
                    <span class="online-label">онлайн</span>
                </div>
            </div>
            <div class="nav">
                <a href="#" class="nav-link" data-page="home"><i class="fas fa-home"></i> Главная</a>
                <a href="#" class="nav-link" data-page="lfg"><i class="fas fa-users"></i> Поиск команды <span id="response-badge" class="notification-badge" style="display: none;">0</span></a>
                <a href="#" class="nav-link" data-page="tournaments"><i class="fas fa-trophy"></i> Турниры</a>
                <a href="#" class="nav-link" data-page="friends"><i class="fas fa-user-friends"></i> Друзья <span id="unread-badge" class="notification-badge" style="display: none;">0</span></a>
                <a href="#" class="nav-link" data-page="admin" id="admin-link" style="display: none;"><i class="fas fa-shield-alt"></i> Админ</a>
                <div id="auth-section"></div>
            </div>
        </div>
    </header>

    <div id="app" style="padding-top: 40px;">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div>
    </div>

    <script>
        // ==================== КОНФИГУРАЦИЯ ====================
        const API_BASE_URL = ['localhost', '127.0.0.1'].includes(window.location.hostname)
            ? '/api'
            : 'https://barside-api.onrender.com/api';

        const api = axios.create({
            baseURL: API_BASE_URL,
            withCredentials: true,
            headers: { 'Content-Type': 'application/json' }
        });

        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let currentUser = null;
        let currentPage = 'home';
        let isLoading = false;
        let postsCache = [];
        let tournamentsCache = [];
        let responsesCache = {};
        let friendsCache = [];
        
        let isLoadingHome = false;
        let isLoadingLfg = false;
        let isLoadingTournaments = false;
        let isLoadingFriends = false;
        let isLoadingAdmin = false;
        let isLoadingProfile = false;
        let isLoadingChat = false;

        // ==================== УТИЛИТЫ ====================
        function showToast(message, type = 'success', title = '') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const titles = { success: '✅ Успешно', error: '❌ Ошибка', info: 'ℹ️ Информация' };
            const icons = { success: '✓', error: '✕', info: 'i' };
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<div class="toast-icon">${icons[type] || '✓'}</div><div class="toast-content"><div class="toast-title">${title || titles[type]}</div><div class="toast-message">${message}</div></div><button class="toast-close">✕</button>`;
            container.appendChild(toast);
            toast.querySelector('.toast-close').onclick = () => toast.remove();
            setTimeout(() => toast.remove(), 4000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatTime(dateStr) {
            try { return new Date(dateStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } 
            catch(e) { return ''; }
        }

        function formatDate(dateStr) {
            try { return new Date(dateStr).toLocaleDateString('ru-RU'); } 
            catch(e) { return ''; }
        }

        function customConfirm(message) {
            return new Promise((resolve) => {
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.style.zIndex = '10001';
                modal.innerHTML = `<div class="modal-content" style="max-width: 400px;"><div class="modal-header"><h2 class="text-green">Подтверждение</h2><button class="modal-close" id="confirm-close">✕</button></div><p style="margin-bottom: 25px; color: #ccc;">${message}</p><div class="flex" style="justify-content: flex-end; gap: 12px;"><button id="confirm-cancel" class="btn" style="background: #555;">Отмена</button><button id="confirm-ok" class="btn btn-green">Да, подтверждаю</button></div></div>`;
                document.body.appendChild(modal);
                const close = () => modal.remove();
                modal.querySelector('#confirm-close').onclick = () => { resolve(false); close(); };
                modal.querySelector('#confirm-cancel').onclick = () => { resolve(false); close(); };
                modal.querySelector('#confirm-ok').onclick = () => { resolve(true); close(); };
                modal.onclick = (e) => { if (e.target === modal) { resolve(false); close(); } };
            });
        }

        function showLoading() {
            const app = document.getElementById('app');
            if (app) app.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div>';
        }

        function showError(message) {
            const app = document.getElementById('app');
            if (app) app.innerHTML = `<div class="container"><div class="card text-center" style="color: #f44336;"><i class="fas fa-exclamation-triangle" style="font-size: 48px; margin-bottom: 16px;"></i><p>${message}</p><button class="btn btn-primary" style="margin-top: 16px;" onclick="location.reload()">Обновить страницу</button></div></div>`;
        }

        // ==================== НАВИГАЦИЯ ====================
        function navigate(page, params = {}) {
            if (isLoading) return;
            currentPage = page;
            let url = `/${page}`;
            if (page === 'profile' && params.id) {
                currentPage = `profile/${params.id}`;
                url = `/profile/${params.id}`;
            }
            if (page === 'chat' && params.id) {
                currentPage = `chat/${params.id}`;
                url = `/chat/${params.id}`;
            }
            if (page === 'lfg-create') {
                currentPage = 'lfg-create';
                url = `/lfg/create`;
            }
            window.history.pushState({}, '', url);
            renderPage();
        }

        // ==================== ОНЛАЙН СЧЁТЧИК ====================
        async function updateOnlineCount() {
            try {
                const res = await api.get('/online');
                const countEl = document.getElementById('online-count');
                if (countEl) countEl.textContent = res.data.count || 0;
            } catch(e) {}
        }

        async function sendHeartbeat() {
            let sessionId = sessionStorage.getItem('sessionId');
            if (!sessionId) { sessionId = crypto.randomUUID(); sessionStorage.setItem('sessionId', sessionId); }
            try { await api.post('/heartbeat', { sessionId }); } catch(e) {}
        }

        // ==================== АВТОРИЗАЦИЯ ====================
        async function loadAuth() {
            try {
                const res = await api.get('/auth/me');
                currentUser = res.data.data;
                updateAuthUI();
                if (currentUser) {
                    loadUnreadCounts();
                    loadBalance();
                }
            } catch(e) { 
                currentUser = null; 
                updateAuthUI(); 
            }
        }

        async function loadBalance() {
            if (!currentUser) return;
            try {
                const res = await api.get('/balance');
                const balanceSpan = document.getElementById('header-balance');
                if (balanceSpan) balanceSpan.textContent = res.data.balance || 0;
            } catch(e) {}
        }

        async function loadUnreadCounts() {
            if (!currentUser) return;
            try {
                const msgRes = await api.get('/messages/unread/count');
                const msgBadge = document.getElementById('unread-badge');
                if (msgBadge) {
                    if (msgRes.data.count > 0) { msgBadge.style.display = 'inline'; msgBadge.textContent = msgRes.data.count; } 
                    else { msgBadge.style.display = 'none'; }
                }
            } catch(e) {}
            try {
                const respRes = await api.get('/lfg/responses/unread');
                const respBadge = document.getElementById('response-badge');
                if (respBadge) {
                    if (respRes.data.count > 0) { respBadge.style.display = 'inline'; respBadge.textContent = respRes.data.count; } 
                    else { respBadge.style.display = 'none'; }
                }
            } catch(e) {}
        }

        function updateAuthUI() {
            const authSection = document.getElementById('auth-section');
            const adminLink = document.getElementById('admin-link');
            if (!authSection) return;
            
            if (currentUser) {
                authSection.innerHTML = `
                    <a href="#" class="profile-btn">
                        <img src="${currentUser.steamAvatar}" class="profile-avatar-small">
                        <div style="display: flex; flex-direction: column; align-items: flex-start;">
                            <span class="profile-name">${escapeHtml(currentUser.displayName || currentUser.steamNickname)}</span>
                            <span style="font-size: 11px; color: #ffd700; display: flex; align-items: center; gap: 4px;">
                                <i class="fas fa-coins"></i> 
                                <span id="header-balance">${currentUser.balance || 0}</span> ₽
                                <button onclick="window.showTopupModal()" style="background: none; border: none; color: #4cff00; cursor: pointer; margin-left: 5px; font-size: 10px;" title="Пополнить баланс">
                                    <i class="fas fa-plus-circle"></i>
                                </button>
                            </span>
                        </div>
                        <span class="profile-arrow">→</span>
                    </a>
                `;
                const profileBtn = document.querySelector('.profile-btn');
                if (profileBtn) {
                    profileBtn.addEventListener('click', (e) => { 
                        e.preventDefault(); 
                        navigate('profile', { id: currentUser.steamId }); 
                    });
                }
                if (adminLink) adminLink.style.display = currentUser.isAdmin ? 'flex' : 'none';
            } else {
                authSection.innerHTML = `<a href="/api/auth/steam" class="btn btn-primary"><i class="fab fa-steam"></i> Войти через Steam</a>`;
                if (adminLink) adminLink.style.display = 'none';
            }
        }

        // ==================== ОТРИСОВКА СТРАНИЦ ====================
        async function renderPage() {
            if (isLoading) return;
            isLoading = true;
            
            try {
                if (currentPage === 'home') await renderHome();
                else if (currentPage === 'lfg') await renderLfg();
                else if ((currentPage === 'lfg-create' || currentPage === 'lfg/create') && currentUser) renderLfgCreate();
                else if (currentPage === 'tournaments') await renderTournaments();
                else if (currentPage === 'friends') await renderFriends();
                else if (currentPage === 'admin' && currentUser?.isAdmin) await renderAdmin();
                else if (currentPage.startsWith('profile/')) await renderProfile(currentPage.split('/')[1]);
                else if (currentPage.startsWith('chat/')) await renderChat(currentPage.split('/')[1]);
                else await renderHome();
            } catch (error) {
                console.error('Render error:', error);
                showError('Ошибка загрузки страницы. Пожалуйста, обновите страницу.');
            } finally {
                isLoading = false;
            }
        }

        // ============ ГЛАВНАЯ СТРАНИЦА ============
        async function renderHome() {
            if (isLoadingHome) return;
            isLoadingHome = true;
            
            try {
                const statsRes = await api.get('/stats');
                const stats = statsRes.data;
                
                const html = `
                    <div class="container">
                        <div style="text-align: center; padding: 60px 20px; background: linear-gradient(135deg, rgba(76,0,255,0.1), rgba(255,61,0,0.05)); border-radius: 24px; margin-bottom: 40px;">
                            <h1 style="font-size: 48px; margin-bottom: 20px; font-weight: 800;">BARSIDE <span style="background: linear-gradient(135deg, #4caf50, #8bc34a); -webkit-background-clip: text; background-clip: text; color: transparent;">CS2</span></h1>
                            <p class="text-gray" style="font-size: 18px; margin-bottom: 30px;">Лучшие турниры, поиск тиммейтов и сообщество для настоящих фанатов Counter-Strike 2</p>
                            <div class="flex" style="justify-content: center; gap: 15px;">
                                <button class="btn btn-primary" onclick="navigate('tournaments')"><i class="fas fa-trophy"></i> Турниры</button>
                                <button class="btn btn-outline" onclick="navigate('lfg')"><i class="fas fa-users"></i> Найти команду</button>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card"><i class="fas fa-users" style="font-size: 32px; margin-bottom: 10px;"></i><div class="stat-number">${stats.totalUsers || 0}</div><div class="stat-label">Игроков</div></div>
                            <div class="stat-card"><i class="fas fa-file-alt" style="font-size: 32px; margin-bottom: 10px;"></i><div class="stat-number">${stats.totalLfgPosts || 0}</div><div class="stat-label">Активных анкет</div></div>
                            <div class="stat-card"><i class="fas fa-trophy" style="font-size: 32px; margin-bottom: 10px;"></i><div class="stat-number">${stats.totalTournaments || 0}</div><div class="stat-label">Турниров</div></div>
                            <div class="stat-card"><i class="fas fa-users" style="font-size: 32px; margin-bottom: 10px;"></i><div class="stat-number">${stats.totalUsers || 0}</div><div class="stat-label">Всего игроков</div></div>
                        </div>
                        <div class="card" style="text-align: center;">
                            <h2 class="text-green">Готов к соревнованиям?</h2>
                            <p class="text-gray" style="margin-bottom: 20px;">Присоединяйся к турнирам, находи тиммейтов и повышай свой скилл</p>
                            <div class="flex" style="justify-content: center; gap: 15px;">
                                ${currentUser ? '<button class="btn btn-primary" onclick="navigate(\'tournaments\')">🏆 Участвовать</button>' : '<a href="/api/auth/steam" class="btn btn-primary"><i class="fab fa-steam"></i> Войти через Steam</a>'}
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('app').innerHTML = html;
                attachNavigationEvents();
            } catch (error) {
                console.error('Home error:', error);
                showError('Не удалось загрузить главную страницу');
            } finally {
                isLoadingHome = false;
            }
        }

        // ============ LFG СПИСОК ============
        async function renderLfg() {
            if (isLoadingLfg) return;
            isLoadingLfg = true;
            showLoading();
            
            try {
                const [activeRes, completedRes] = await Promise.all([
                    api.get('/lfg'),
                    api.get('/lfg/completed')
                ]);
                const posts = activeRes.data.data || [];
                const completedPosts = completedRes.data.data || [];
                postsCache = posts;
                
                let postsHtml = '';
                for (const post of posts) {
                    const isAuthor = currentUser?.id === post.authorId;
                    const rolesNeeded = post.rolesNeeded || {};
                    const availableRoles = Object.keys(rolesNeeded).filter(r => rolesNeeded[r]);
                    
                    let responsesHtml = '';
                    if (isAuthor && responsesCache[post.id] && responsesCache[post.id].length > 0) {
                        responsesHtml = `<div style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                            <h4 class="text-green" style="margin-bottom: 10px;">Отклики (${responsesCache[post.id].length}):</h4>`;
                        for (const r of responsesCache[post.id]) {
                            responsesHtml += `<div class="response-card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                                <div style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="navigate('profile', { id: '${r.user?.steamId}' })">
                                    <img src="${r.user?.steamAvatar}" style="width: 36px; height: 36px; border-radius: 50%;">
                                    <div><strong>${escapeHtml(r.user?.displayName || r.user?.steamNickname)}</strong><p class="text-gray" style="font-size: 11px;">Хочет играть на <span class="role-badge role-${r.role}">${r.role}</span></p></div>
                                </div>
                                <div style="margin-top: 8px;"><button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="acceptResponse('${post.id}', '${r.id}')">✅ Принять</button>
                                <button class="btn" style="background: #f44336; padding: 6px 12px; font-size: 12px; margin-left: 5px;" onclick="rejectResponse('${post.id}', '${r.id}')">❌ Отклонить</button></div>
                            </div>`;
                        }
                        responsesHtml += `</div>`;
                    }
                    
                    postsHtml += `
                        <div class="lfg-card">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
                                <div style="display: flex; gap: 12px; align-items: center; cursor: pointer;" onclick="navigate('profile', { id: '${post.author?.steamId}' })">
                                    <img src="${post.author?.steamAvatar}" style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--primary);">
                                    <div><h3>${escapeHtml(post.title)}</h3><p class="text-gray" style="font-size: 11px;">${escapeHtml(post.author?.displayName || post.author?.steamNickname)}</p></div>
                                </div>
                                <div class="status-badge status-upcoming">Ищет ${post.playersNeeded} игроков</div>
                            </div>
                            <div class="flex" style="gap: 10px; margin-bottom: 12px; flex-wrap: wrap; font-size: 12px;">
                                <span>${post.region === 'RU' ? '🇷🇺 Россия' : '🌏 Другой'}</span>
                                <span>🎭 <span class="role-badge role-${post.myRole}">${post.myRole}</span></span>
                                <span>📈 ${post.minFaceitLevel}+ FaceIt</span>
                                <span>🗣️ ${post.language === 'ru' ? '🇷🇺 Русский' : '🇬🇧 English'}</span>
                            </div>
                            <div style="margin-bottom: 12px;">
                                <p class="text-gray" style="font-size: 12px;">📅 ${escapeHtml(post.schedule)}</p>
                                ${availableRoles.length > 0 ? `<p class="text-gray" style="font-size: 12px;">🎮 Нужны роли: ${availableRoles.map(r => `<span class="role-badge role-${r}" style="margin-right: 5px;">${r}</span>`).join('')}</p>` : ''}
                            </div>
                            ${post.description ? `<p class="text-gray" style="font-size: 13px; margin-bottom: 12px; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 8px;">${escapeHtml(post.description)}</p>` : ''}
                            <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;">
                                ${!isAuthor && currentUser && availableRoles.length > 0 ? `<button class="btn btn-primary" style="flex: 1;" onclick="showRespondModal('${post.id}', ${JSON.stringify(availableRoles)})">📝 Откликнуться</button>` : ''}
                                ${!isAuthor && currentUser && availableRoles.length === 0 ? `<button class="btn" style="flex: 1; background: #555;" disabled>❌ Нет свободных ролей</button>` : ''}

                    document.getElementById('lfg-players').value = btn.getAttribute('data-players');
                };
            });
            document.querySelectorAll('.schedule-type-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.schedule-type-btn').forEach(b => b.classList.remove('btn-primary'));
                    btn.classList.add('btn-primary');
                    const daily = document.getElementById('daily-schedule');
                    const weekly = document.getElementById('weekly-schedule');
                    if (btn.getAttribute('data-type') === 'daily') { daily.style.display = 'block'; weekly.style.display = 'none'; }

                };
            });
            document.querySelectorAll('.weekday-input').forEach(inp => {
                inp.addEventListener('input', function() { 
                    const counter = this.nextElementSibling;
                    if (counter) counter.textContent = `${this.value.length}/50`;
                });
            });
            const scheduleInput = document.getElementById('lfg-schedule');
            if (scheduleInput) {
                scheduleInput.addEventListener('input', function() { 
                    const counter = this.nextElementSibling;
                    if (counter) counter.textContent = `${this.value.length}/50`;
                });
            }
            document.querySelector('.players-btn')?.classList.add('btn-primary');
            
            const form = document.getElementById('create-lfg-form');

                    e.preventDefault();
                    const scheduleType = document.querySelector('.schedule-type-btn.btn-primary').getAttribute('data-type');
                    let schedule = '';
                    let weekSchedule = null;
                    if (scheduleType === 'daily') schedule = document.getElementById('lfg-schedule').value;
                    else {
                        weekSchedule = {};
                        document.querySelectorAll('.weekday-input').forEach(inp => { weekSchedule[inp.getAttribute('data-day')] = inp.value; });
                        schedule = JSON.stringify(weekSchedule);
                    }
                    const rolesNeeded = {};
                    document.querySelectorAll('#roles-checkboxes input:checked').forEach(cb => { rolesNeeded[cb.value] = true; });
                    if (Object.keys(rolesNeeded).length === 0) { showToast('Выберите хотя бы одну роль', 'error'); return; }
                    try {
                        await api.post('/lfg', {
                            title: document.getElementById('lfg-title').value,
                            region: document.getElementById('lfg-region').value,
                            myRole: document.getElementById('lfg-myrole').value,
                            playersNeeded: parseInt(document.getElementById('lfg-players').value),
                            schedule: schedule,
                            scheduleType: scheduleType,
                            weekSchedule: weekSchedule,
                            description: document.getElementById('lfg-description').value,
                            rolesNeeded: rolesNeeded,
                            minFaceitLevel: parseInt(document.getElementById('lfg-faceit').value),
                            minPremierRank: parseInt(document.getElementById('lfg-premier').value),
                            language: document.getElementById('lfg-language').value
                        });
                        showToast('Анкета создана!', 'success');
                        navigate('lfg');
                    } catch(err) { 
                        showToast(err.response?.data?.error || 'Ошибка при создании анкеты', 'error'); 
                    }
                };
            }
        }

                    api.get('/friends/requests'),

                const requests = requestsRes.data.data || [];

                let friendsHtml = '', requestsHtml = '', sentHtml = '';

                    requestsHtml += `<div class="card compact-friend" style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;"><img src="${r.fromAvatar}" style="width: 40px; height: 40px; border-radius: 50%;"><div style="flex:1;"><h4 style="font-size: 16px;">${escapeHtml(r.fromName)}</h4></div><button class="btn btn-primary" style="padding: 6px 12px;" onclick="acceptFriendRequest('${r.id}')">✅</button><button class="btn" style="background: #555; padding: 6px 12px;" onclick="declineFriendRequest('${r.id}')">❌</button></div>`;

        // ============ ЧАТ ============
        async function renderChat(userId) {
            if (isLoadingChat) return;
            isLoadingChat = true;
            showLoading();
            
            if (!currentUser) {
                document.getElementById('app').innerHTML = '<div class="container"><div class="card text-center">Войдите через Steam</div></div>';
                isLoadingChat = false;
                return;
            }
            
            try {
                const userRes = await api.get(`/user/by-id/${userId}`);
                const chatUser = userRes.data.user;
                if (!chatUser) throw new Error('User not found');
                
                const messagesRes = await api.get(`/messages/${userId}`);
                const messages = messagesRes.data.data || [];
                
                let msgsHtml = '';
                for (const msg of messages) {
                    const isOwn = msg.fromId === currentUser.id;
                    msgsHtml += `<div style="text-align: ${isOwn ? 'right' : 'left'}; margin-bottom: 15px;">
                        <div style="display: inline-block; background: ${isOwn ? 'var(--primary)' : 'rgba(255,255,255,0.08)'}; padding: 10px 14px; border-radius: 16px; max-width: 75%;">
                            <p style="font-size: 13px; margin-bottom: 4px;">${escapeHtml(msg.text)}</p>
                            <p style="font-size: 9px; color: rgba(255,255,255,0.4);">${formatTime(msg.createdAt)}</p>
                        </div>
                    </div>`;
                }
                
                const html = `
                    <div class="container" style="max-width: 800px; margin: 0 auto;">
                        <div class="card" style="margin-bottom: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                            <button class="btn" style="background: #555; padding: 8px 12px;" onclick="navigate('friends')">← Назад</button>
                            <img src="${chatUser.steamAvatar}" style="width: 48px; height: 48px; border-radius: 50%;">
                            <div style="flex:1;"><h3>${escapeHtml(chatUser.displayName || chatUser.steamNickname)}</h3></div>
                        </div>
                        <div class="card" style="height: 450px; display: flex; flex-direction: column;">
                            <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 16px;">
                                ${messages.length === 0 ? '<div class="text-center" style="padding: 40px;">Нет сообщений</div>' : msgsHtml}
                            </div>
                            <form id="chat-form" style="display: flex; gap: 10px; padding: 12px; border-top: 1px solid rgba(76,0,255,0.2);">
                                <input type="text" id="chat-input" class="form-input" style="flex: 1;" placeholder="Сообщение...">
                                <button type="submit" class="btn btn-primary">📤</button>
                            </form>
                        </div>
                    </div>
                `;
                document.getElementById('app').innerHTML = html;
                attachNavigationEvents();
                
                const chatContainer = document.getElementById('chat-messages');
                if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
                
                const chatForm = document.getElementById('chat-form');
                if (chatForm) {
                    chatForm.onsubmit = async (e) => {
                        e.preventDefault();
                        const input = document.getElementById('chat-input');
                        const text = input.value.trim();
                        if (!text) return;
                        try {
                            await api.post(`/messages/${userId}`, { text });
                            input.value = '';
                            await renderChat(userId);
                        } catch(err) { showToast('Ошибка отправки', 'error'); }
                    };
                }
                
                const interval = setInterval(async () => {
                    if (currentPage === `chat/${userId}`) {
                        try {
                            const newMessages = await api.get(`/messages/${userId}`);
                            const newMsgsHtml = renderMessagesHtml(newMessages.data.data || [], currentUser.id);
                            const chatDiv = document.getElementById('chat-messages');
                            if (chatDiv) chatDiv.innerHTML = newMsgsHtml;
                        } catch(e) {}
                    } else {
                        clearInterval(interval);
                    }
                }, 3000);
                
            } catch (error) {
                console.error('Chat error:', error);
                showError('Не удалось загрузить чат');
            } finally {
                isLoadingChat = false;
            }
        }

        function renderMessagesHtml(messages, currentUserId) {
            let html = '';
            for (const msg of messages) {
                const isOwn = msg.fromId === currentUserId;
                html += `<div style="text-align: ${isOwn ? 'right' : 'left'}; margin-bottom: 15px;">
                    <div style="display: inline-block; background: ${isOwn ? 'var(--primary)' : 'rgba(255,255,255,0.08)'}; padding: 10px 14px; border-radius: 16px; max-width: 75%;">
                        <p style="font-size: 13px; margin-bottom: 4px;">${escapeHtml(msg.text)}</p>
                        <p style="font-size: 9px; color: rgba(255,255,255,0.4);">${formatTime(msg.createdAt)}</p>
                    </div>
                </div>`;
            }
            return html || '<div class="text-center" style="padding: 40px;">Нет сообщений</div>';
        }

        // ============ АДМИН ============
        async function renderAdmin() {
            if (isLoadingAdmin) return;
            isLoadingAdmin = true;
            showLoading();
            
            if (!currentUser?.isAdmin) {
                document.getElementById('app').innerHTML = '<div class="container"><div class="card text-center">Доступ запрещён</div></div>';
                isLoadingAdmin = false;
                return;
            }
            
            try {
                const users = (await api.get('/admin/users')).data.data || [];
                let rows = '';
                for (const u of users) {
                    rows += `<tr style="border-bottom: 1px solid #333; cursor: pointer;" onclick="navigate('profile', { id: '${u.steamId}' })">
                        <td style="padding: 10px;"><div style="display: flex; align-items: center; gap: 8px;"><img src="${u.steamAvatar}" style="width: 28px; height: 28px; border-radius: 50%;">${escapeHtml(u.displayName || u.steamNickname)}</div></td>
                        <td style="padding: 10px;">${u.balance} ₽</td>
                        <td style="padding: 10px;">${u.isAdmin ? '👑 Админ' : '👤 Пользователь'}</td>
                        <td style="padding: 10px;">${u.isBanned ? '🔴 Забанен' : '🟢 Активен'}</td>
                    </tr>`;
                }
                const html = `
                    <div class="container">
                        <h1 style="font-size: 28px; margin-bottom: 20px;">👑 Админ-панель</h1>
                        <div class="card">
                            <h2 class="text-green">Все пользователи</h2>
                            <div style="overflow-x: auto; margin-top: 15px;">
                                <table style="width: 100%; font-size: 13px;">
                                    <thead><tr style="border-bottom: 1px solid #333;"><th style="padding: 8px; text-align: left;">Ник</th><th style="padding: 8px; text-align: left;">Баланс</th><th style="padding: 8px; text-align: left;">Статус</th><th style="padding: 8px; text-align: left;">Бан</th></tr></thead>
                                    <tbody>${rows}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('app').innerHTML = html;
                attachNavigationEvents();
            } catch (error) {
                console.error('Admin error:', error);
                showError('Не удалось загрузить админ-панель');
            } finally {
                isLoadingAdmin = false;
            }
        }

        // ============ ФУНКЦИИ ДЕЙСТВИЙ (глобальные) ============
        window.showRespondModal = function(postId, roles) {
            let btns = '';
            for (const r of roles) btns += `<button class="btn btn-outline" style="margin: 5px;" onclick="respondToLfg('${postId}', '${r}')">${r}</button>`;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.style.zIndex = '10001';
            modal.innerHTML = `<div class="modal-content" style="max-width: 400px;"><div class="modal-header"><h2 class="text-green">Выберите роль</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div><div style="text-align: center; padding: 20px;">${btns}</div></div>`;
            document.body.appendChild(modal);
        };

        window.respondToLfg = async function(postId, role) {
            const modal = document.querySelector('.modal-overlay');
            if (modal) modal.remove();
            try { 
                await api.post(`/lfg/${postId}/respond`, { role }); 
                showToast('Отклик отправлен!', 'success'); 
                renderPage(); 
            } catch(err) { 
                showToast(err.response?.data?.error || 'Ошибка', 'error'); 
            }
        };

        window.loadResponses = async function(postId) {
            try {
                const res = await api.get(`/lfg/${postId}/responses`);
                responsesCache[postId] = res.data.data || [];
                renderPage();
            } catch(e) { showToast('Ошибка загрузки откликов', 'error'); }
        };

        window.acceptResponse = async function(postId, responseId) {
            try { 
                await api.post(`/lfg/${postId}/responses/${responseId}/accept`); 
                showToast('Игрок принят!', 'success'); 
                renderPage(); 
            } catch(err) { showToast('Ошибка', 'error'); }
        };

        window.rejectResponse = async function(postId, responseId) {
            try { 
                await api.post(`/lfg/${postId}/responses/${responseId}/reject`); 
                showToast('Отклик отклонен', 'info'); 
                renderPage(); 
            } catch(err) { showToast('Ошибка', 'error'); }

            } catch(err) {

        window.acceptFriendRequest = async function(requestId) {

        window.showTournamentDetails = function(tournamentId) {
            const t = tournamentsCache.find(t => t.id === tournamentId);
            if (!t) return;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.style.zIndex = '10001';
            modal.innerHTML = `<div class="modal-content" style="max-width: 600px;"><div class="modal-header"><h2 class="text-green">${escapeHtml(t.title)}</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div><div class="prize" style="text-align: center;">🏆 ${t.prizePool}</div><p>📅 Дата: ${new Date(t.date).toLocaleString('ru-RU')}</p><p>👥 Формат: ${t.format}</p><p>💰 Взнос: ${t.entryFee} ₽</p>${t.description ? `<p class="text-gray" style="margin-top: 15px;">${escapeHtml(t.description)}</p>` : ''}<button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="showToast('Функция в разработке', 'info'); this.closest('.modal-overlay').remove()">Зарегистрировать команду</button></div>`;
            document.body.appendChild(modal);
        };

        window.showFriendsTab = function(tab) {
            const friends = document.getElementById('friends-tab-friends');
            const requests = document.getElementById('friends-tab-requests');
            const sent = document.getElementById('friends-tab-sent');
            const btns = document.querySelectorAll('.flex button');
            if (friends) friends.style.display = 'none';
            if (requests) requests.style.display = 'none';
            if (sent) sent.style.display = 'none';
            if (tab === 'friends') { if (friends) friends.style.display = 'block'; if (btns[0]) btns[0].className = 'btn btn-primary'; if (btns[1]) btns[1].className = 'btn btn-outline'; if (btns[2]) btns[2].className = 'btn btn-outline'; }
            else if (tab === 'requests') { if (requests) requests.style.display = 'block'; if (btns[0]) btns[0].className = 'btn btn-outline'; if (btns[1]) btns[1].className = 'btn btn-primary'; if (btns[2]) btns[2].className = 'btn btn-outline'; }
            else { if (sent) sent.style.display = 'block'; if (btns[0]) btns[0].className = 'btn btn-outline'; if (btns[1]) btns[1].className = 'btn btn-outline'; if (btns[2]) btns[2].className = 'btn btn-primary'; }
        };

        // ============ ПЛАТЕЖИ (ГЛОБАЛЬНЫЕ ФУНКЦИИ) ============
        window.showTopupModal = function() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.style.zIndex = '10001';
            modal.innerHTML = `
                <div class="modal-content" style="max-width: 450px;">
                    <div class="modal-header">
                        <h2 class="text-green">💰 Пополнение баланса</h2>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
                    </div>
                    <div style="padding: 10px 0 20px 0;">
                        <div class="form-group">
                            <label>Сумма пополнения (₽)</label>
                            <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                                <button type="button" class="btn btn-outline topup-amount" data-amount="100">100 ₽</button>
                                <button type="button" class="btn btn-outline topup-amount" data-amount="500">500 ₽</button>
                                <button type="button" class="btn btn-outline topup-amount" data-amount="1000">1 000 ₽</button>
                                <button type="button" class="btn btn-outline topup-amount" data-amount="5000">5 000 ₽</button>
                            </div>
                            <div class="flex" style="gap: 10px;">
                                <input type="number" id="custom-amount" class="form-input" placeholder="Своя сумма (от 100)" min="100" max="100000" step="100">
                                <button id="set-custom-amount" class="btn btn-outline">Установить</button>
                            </div>
                            <p class="text-gray" style="font-size: 11px; margin-top: 8px;">Минимум: 100 ₽, максимум: 100 000 ₽</p>
                        </div>
                        <div id="topup-error" style="color: #f44336; font-size: 12px; margin: 10px 0; display: none;"></div>
                        <div style="display: flex; gap: 12px; margin-top: 20px;">
                            <button class="btn" style="flex: 1; background: #555;" onclick="this.closest('.modal-overlay').remove()">Отмена</button>
                            <button id="pay-button" class="btn btn-primary" style="flex: 1;">💳 Оплатить</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            let selectedAmount = null;
            
            document.querySelectorAll('.topup-amount').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.topup-amount').forEach(b => b.classList.remove('btn-primary'));
                    btn.classList.add('btn-primary');
                    selectedAmount = parseInt(btn.getAttribute('data-amount'));
                    document.getElementById('custom-amount').value = '';
                    document.getElementById('topup-error').style.display = 'none';
                };
            });
            
            document.getElementById('set-custom-amount').onclick = () => {
                const custom = parseInt(document.getElementById('custom-amount').value);
                if (custom && custom >= 100 && custom <= 100000) {
                    document.querySelectorAll('.topup-amount').forEach(b => b.classList.remove('btn-primary'));
                    selectedAmount = custom;
                    document.getElementById('topup-error').style.display = 'none';
                } else {
                    document.getElementById('topup-error').textContent = 'Введите сумму от 100 до 100 000 ₽';
                    document.getElementById('topup-error').style.display = 'block';
                }
            };
            
            document.getElementById('pay-button').onclick = async () => {
                if (!selectedAmount) {
                    document.getElementById('topup-error').textContent = 'Выберите или введите сумму';
                    document.getElementById('topup-error').style.display = 'block';
                    return;
                }
                
                const payBtn = document.getElementById('pay-button');
                const originalText = payBtn.innerHTML;
                payBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Обработка...';
                payBtn.disabled = true;
                
                try {
                    const res = await api.post('/payments/create', {
                        amount: selectedAmount,
                        returnUrl: window.location.href
                    });
                    
                    if (res.data.success && res.data.confirmationUrl) {
                        window.open(res.data.confirmationUrl, '_blank');
                        modal.remove();
                        showToast(`Платёж на ${selectedAmount} ₽ создан. Откроется страница оплаты.`, 'info');
                        checkPaymentStatus(res.data.paymentId);
                    } else {
                        showToast('Ошибка при создании платежа', 'error');
                        payBtn.innerHTML = originalText;
                        payBtn.disabled = false;
                    }
                } catch (err) {
                    showToast(err.response?.data?.error || 'Ошибка при создании платежа', 'error');
                    payBtn.innerHTML = originalText;
                    payBtn.disabled = false;
                }
            };
        };

        async function checkPaymentStatus(paymentId) {
            let attempts = 0;
            const maxAttempts = 60;
            
            const interval = setInterval(async () => {
                attempts++;
                try {
                    const res = await api.get(`/payments/${paymentId}/status`);
                    
                    if (res.data.status === 'completed') {
                        clearInterval(interval);
                        showToast(`✅ Баланс пополнен на ${res.data.amount} ₽!`, 'success');
                        loadBalance();
                        if (currentPage.startsWith('profile/') && currentUser) {
                            renderProfile(currentUser.steamId);
                        }
                    } else if (res.data.status === 'canceled') {
                        clearInterval(interval);
                        showToast('❌ Платёж был отменён', 'error');
                    }
                } catch (err) {}
                
                if (attempts >= maxAttempts) {
                    clearInterval(interval);
                    showToast('⏰ Время проверки истекло. Проверьте баланс позже.', 'info');
                }
            }, 5000);
        }

        // ============ ПРИВЯЗКА СОБЫТИЙ НАВИГАЦИИ ============
        function attachNavigationEvents() {
            document.querySelectorAll('[data-page]').forEach(el => {
                el.removeEventListener('click', handleNavClick);
                el.addEventListener('click', handleNavClick);
            });
        }

        function handleNavClick(e) {
            e.preventDefault();
            const page = this.getAttribute('data-page');
            if (page === 'profile') {
                const steamId = this.getAttribute('data-steamid');
                if (steamId) navigate('profile', { id: steamId });
            } else {
                navigate(page);
            }
        }

        // ============ ИНИЦИАЛИЗАЦИЯ ============
        async function init() {
            await loadAuth();
            updateOnlineCount();
            sendHeartbeat();
            
            setInterval(updateOnlineCount, 30000);
            setInterval(sendHeartbeat, 30000);
            setInterval(() => { if (currentUser) loadUnreadCounts(); }, 10000);
            
            window.addEventListener('popstate', () => {
                const path = window.location.pathname.slice(1) || 'home';
                if (path !== currentPage) {
                    currentPage = path;
                    renderPage();
                }
            });
            
            const initialPath = window.location.pathname.slice(1) || 'home';
            currentPage = initialPath;
            renderPage();
        }
        
        init();
    </script>
