<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BARSIDE CS2 - Поиск команды и турниры</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <style>
        /* Дополнительные стили для SPA */
        .page { display: none; }
        .page.active { display: block; }
        .clickable { cursor: pointer; }
        .loading { text-align: center; padding: 50px; }
        .role-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        .role-IGL { background: #ffd70020; color: #ffd700; border: 1px solid #ffd70040; }
        .role-AWP { background: #4caf5020; color: #4caf50; border: 1px solid #4caf5040; }
        .role-ENTRY { background: #ff980020; color: #ff9800; border: 1px solid #ff980040; }
        .role-RIFLER { background: #2196f320; color: #2196f3; border: 1px solid #2196f340; }
        .role-LURKER { background: #9c27b020; color: #9c27b0; border: 1px solid #9c27b040; }
        .notification-badge { background: #f44336; border-radius: 10px; padding: 2px 6px; font-size: 10px; margin-left: 5px; animation: pulse 1s infinite; }
        .custom-select { position: relative; width: 100%; }
        .custom-select-trigger { background: rgba(255,255,255,0.05); border: 1px solid rgba(76,0,255,0.3); border-radius: 14px; padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .custom-select-trigger:hover { border-color: var(--primary); }
        .custom-select-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a24; border: 1px solid rgba(76,0,255,0.3); border-radius: 14px; margin-top: 5px; z-index: 100; max-height: 250px; overflow-y: auto; display: none; }
        .custom-select.open .custom-select-dropdown { display: block; }
        .custom-select-option { padding: 12px 18px; cursor: pointer; transition: background 0.2s; }
        .custom-select-option:hover { background: rgba(76,0,255,0.15); }
        .custom-select-option.selected { background: rgba(76,0,255,0.3); color: var(--primary-light); }
        .team-slot { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .team-slot.filled { background: rgba(76,0,255,0.15); border: 1px solid rgba(76,0,255,0.3); }
        .team-slot.empty { background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.2); }
        .lfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px; margin: 30px 0; }
        .tournaments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin: 30px 0; }
        @media (max-width: 768px) { .lfg-grid, .tournaments-grid { grid-template-columns: 1fr; } }
        .weekday-schedule { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .weekday-item { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .weekday-name { width: 100px; font-weight: 600; color: var(--primary-light); }
        .weekday-input { flex: 1; min-width: 150px; background: rgba(255,255,255,0.05); border: 1px solid rgba(76,0,255,0.3); border-radius: 10px; padding: 10px 14px; color: white; }
        .weekday-input:focus { outline: none; border-color: var(--primary); }
        .char-counter { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 4px; }
        .char-counter.warning { color: #ff9800; }
        .char-counter.danger { color: #f44336; }
        .response-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 15px; margin-bottom: 12px; }
        .response-card:hover { background: rgba(255,255,255,0.06); }
        .stars { display: inline-flex; gap: 4px; cursor: pointer; }
        .star { font-size: 20px; color: #555; cursor: pointer; }
        .star.active { color: #ffd700; }
        .dropdown-menu { position: absolute; top: 100%; right: 0; background: #1e1e2a; border-radius: 12px; padding: 8px; min-width: 160px; z-index: 1000; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid rgba(76,0,255,0.3); }
        .dropdown-menu button { width: 100%; text-align: left; background: none; border: none; padding: 8px 12px; color: white; cursor: pointer; border-radius: 8px; font-size: 13px; }
        .dropdown-menu button:hover { background: rgba(76,0,255,0.2); }
        .dropdown-menu button.danger { color: #ff5555; }
        .compact-friend { padding: 10px 15px !important; }
        .compact-friend img { width: 40px !important; height: 40px !important; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    
    <!-- ШАПКА -->
    <header class="header">
        <div class="header-content">
            <div class="flex" style="gap: 20px; align-items: center;">
                <a href="#" class="logo" data-page="home">BARSIDE</a>
                <div class="online-indicator">
                    <div class="online-dot-header"></div>
                    <span class="online-count" id="online-count">0</span>
                    <span class="online-label">онлайн</span>
                </div>
            </div>
            <div class="nav">
                <a href="#" class="nav-link" data-page="home"><i class="fas fa-home"></i> Главная</a>
                <a href="#" class="nav-link" data-page="lfg"><i class="fas fa-users"></i> Поиск команды <span id="response-badge" class="notification-badge" style="display: none;">0</span></a>
                <a href="#" class="nav-link" data-page="tournaments"><i class="fas fa-trophy"></i> Турниры</a>
                <a href="#" class="nav-link" data-page="friends"><i class="fas fa-user-friends"></i> Друзья <span id="unread-badge" class="notification-badge" style="display: none;">0</span></a>
                <a href="#" class="nav-link" data-page="admin" id="admin-link" style="display: none;"><i class="fas fa-shield-alt"></i> Админ</a>
                <div id="auth-section"></div>
            </div>
        </div>
    </header>

    <div id="app" style="padding-top: 40px;"></div>

    <script>
        // ==================== API ====================
        const api = axios.create({
            baseURL: 'https://barside-api.onrender.com/api',
            withCredentials: true,
            headers: { 'Content-Type': 'application/json' }
        });

        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let currentUser = null;
        let currentPage = 'home';
        let onlineCount = 0;
        let unreadMessages = 0;
        let unreadResponses = 0;
        let postsCache = [];
        let tournamentsCache = [];

        // ==================== УТИЛИТЫ ====================
        function showToast(message, type = 'success', title = '') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const titles = { success: '✅ Успешно', error: '❌ Ошибка', info: 'ℹ️ Информация' };
            const icons = { success: '✓', error: '✕', info: 'i' };
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<div class="toast-icon">${icons[type] || '✓'}</div><div class="toast-content"><div class="toast-title">${title || titles[type]}</div><div class="toast-message">${message}</div></div><button class="toast-close">✕</button>`;
            container.appendChild(toast);
            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.onclick = () => { toast.remove(); };
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatTime(dateStr) {
            try { const date = new Date(dateStr); return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } 
            catch(e) { return ''; }
        }

        function formatRelativeTime(dateStr) {
            try {
                const date = new Date(dateStr);
                const now = new Date();
                const diffMins = Math.floor((now - date) / 60000);
                const diffHours = Math.floor(diffMins / 60);
                const diffDays = Math.floor(diffHours / 24);
                if (diffMins < 1) return 'только что';
                if (diffMins < 60) return `${diffMins} мин назад`;
                if (diffHours < 24) return `${diffHours} ч назад`;
                return `${diffDays} д назад`;
            } catch(e) { return ''; }
        }

        function customConfirm(message) {
            return new Promise((resolve) => {
                const modalOverlay = document.createElement('div');
                modalOverlay.className = 'modal-overlay';
                modalOverlay.style.zIndex = '10000';
                modalOverlay.innerHTML = `<div class="modal-content" style="max-width: 400px;"><div class="modal-header"><h2 class="text-green">Подтверждение</h2><button class="modal-close" id="confirm-close">✕</button></div><p style="margin-bottom: 25px; color: #ccc;">${message}</p><div class="flex" style="justify-content: flex-end; gap: 12px;"><button id="confirm-cancel" class="btn" style="background: #555;">Отмена</button><button id="confirm-ok" class="btn btn-green">Да, подтверждаю</button></div></div>`;
                document.body.appendChild(modalOverlay);
                const closeModal = () => { modalOverlay.remove(); };
                modalOverlay.querySelector('#confirm-close').onclick = () => { resolve(false); closeModal(); };
                modalOverlay.querySelector('#confirm-cancel').onclick = () => { resolve(false); closeModal(); };
                modalOverlay.querySelector('#confirm-ok').onclick = () => { resolve(true); closeModal(); };
                modalOverlay.onclick = (e) => { if (e.target === modalOverlay) { resolve(false); closeModal(); } };
            });
        }

        // ==================== НАВИГАЦИЯ ====================
        function navigate(page, params = {}) {
            currentPage = page;
            let url = `/${page}`;
            if (page === 'profile' && params.id) url = `/profile/${params.id}`;
            if (page === 'chat' && params.id) url = `/chat/${params.id}`;
            window.history.pushState({}, '', url);
            renderPage();
        }

        // ==================== ОНЛАЙН СЧЁТЧИК ====================
        async function updateOnlineCount() {
            try {
                const res = await api.get('/online');
                onlineCount = res.data.count;
                document.getElementById('online-count').textContent = onlineCount;
            } catch(e) {}
        }

        async function sendHeartbeat() {
            let sessionId = sessionStorage.getItem('sessionId');
            if (!sessionId) { sessionId = crypto.randomUUID(); sessionStorage.setItem('sessionId', sessionId); }
            try { await api.post('/heartbeat', { sessionId }); } catch(e) {}
        }

        // ==================== АВТОРИЗАЦИЯ ====================
        async function loadAuth() {
            try {
                const res = await api.get('/auth/me');
                currentUser = res.data.data;
                updateAuthUI();
                if (currentUser) {
                    loadUnreadCounts();
                    loadBalance();
                }
            } catch(e) { currentUser = null; updateAuthUI(); }
        }

        function updateAuthUI() {
            const authSection = document.getElementById('auth-section');
            const adminLink = document.getElementById('admin-link');
            
            if (currentUser) {
                authSection.innerHTML = `
                    <a href="#" class="profile-btn" data-page="profile" data-steamid="${currentUser.steamId}">
                        <img src="${currentUser.steamAvatar}" class="profile-avatar-small">
                        <div style="display: flex; flex-direction: column; align-items: flex-start;">
                            <span class="profile-name">${escapeHtml(currentUser.displayName || currentUser.steamNickname)}</span>
                            <span style="font-size: 11px; color: #ffd700; display: flex; align-items: center; gap: 4px;"><i class="fas fa-coins"></i> <span id="header-balance">0</span> ₽</span>
                        </div>
                        <span class="profile-arrow">→</span>
                    </a>
                `;
                document.querySelector('[data-page="profile"]')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    navigate('profile', { id: currentUser.steamId });
                });
                if (currentUser.isAdmin) {
                    adminLink.style.display = 'flex';
                } else {
                    adminLink.style.display = 'none';
                }
            } else {
                authSection.innerHTML = `<a href="/api/auth/steam" class="btn btn-primary"><i class="fab fa-steam"></i> Войти через Steam</a>`;
                adminLink.style.display = 'none';
            }
        }

        async function loadBalance() {
            if (!currentUser) return;
            try {
                const res = await api.get('/balance');
                const balanceSpan = document.getElementById('header-balance');
                if (balanceSpan) balanceSpan.textContent = res.data.balance;
            } catch(e) {}
        }

        async function loadUnreadCounts() {
            try {
                const messagesRes = await api.get('/messages/unread/count');
                unreadMessages = messagesRes.data.count || 0;
                const unreadBadge = document.getElementById('unread-badge');
                if (unreadBadge) {
                    unreadBadge.style.display = unreadMessages > 0 ? 'inline' : 'none';
                    unreadBadge.textContent = unreadMessages;
                }
            } catch(e) {}
            
            try {
                const responsesRes = await api.get('/lfg/responses/unread');
                unreadResponses = responsesRes.data.count || 0;
                const responseBadge = document.getElementById('response-badge');
                if (responseBadge) {
                    responseBadge.style.display = unreadResponses > 0 ? 'inline' : 'none';
                    responseBadge.textContent = unreadResponses;
                }
            } catch(e) {}
        }

        // ==================== ОТРИСОВКА СТРАНИЦ ====================
        async function renderPage() {
            const app = document.getElementById('app');
            if (!app) return;
            
            let html = '';
            
            if (currentPage === 'home') {
                html = await renderHomePage();
            } else if (currentPage === 'lfg') {
                html = await renderLfgPage();
            } else if (currentPage === 'tournaments') {
                html = await renderTournamentsPage();
            } else if (currentPage === 'friends') {
                html = await renderFriendsPage();
            } else if (currentPage === 'admin' && currentUser?.isAdmin) {
                html = await renderAdminPage();
            } else if (currentPage.startsWith('profile/')) {
                const steamId = currentPage.split('/profile/')[1];
                html = await renderProfilePage(steamId);
            } else if (currentPage.startsWith('chat/')) {
                const userId = currentPage.split('/chat/')[1];
                html = await renderChatPage(userId);
            } else {
                html = await renderHomePage();
            }
            
            app.innerHTML = html;
            attachEventListeners();
        }

        // ==================== ГЛАВНАЯ СТРАНИЦА ====================
        async function renderHomePage() {
            try {
                const statsRes = await api.get('/stats');
                const stats = statsRes.data;
                
                return `
                    <div class="container">
                        <div style="text-align: center; padding: 60px 20px; background: linear-gradient(135deg, rgba(76,0,255,0.1), rgba(255,61,0,0.05)); border-radius: 24px; margin-bottom: 40px;">
                            <h1 style="font-size: 48px; margin-bottom: 20px; font-weight: 800;">BARSIDE <span style="background: linear-gradient(135deg, #4caf50, #8bc34a); -webkit-background-clip: text; background-clip: text; color: transparent;">CS2</span></h1>
                            <p class="text-gray" style="font-size: 18px; margin-bottom: 30px;">Лучшие турниры, серверы и сообщество для настоящих фанатов Counter-Strike 2</p>
                            <div class="flex" style="justify-content: center; gap: 15px;">
                                <button class="btn btn-primary" onclick="navigate('tournaments')"><i class="fas fa-trophy"></i> Турниры</button>
                                <button class="btn btn-outline" onclick="navigate('lfg')"><i class="fas fa-users"></i> Найти команду</button>
                            </div>
                        </div>
                        
                        <div class="stats-grid">
                            <div class="stat-card"><i class="fas fa-users" style="font-size: 32px; margin-bottom: 10px;"></i><div class="stat-number">${stats.totalUsers || 0}</div><div class="stat-label">Игроков</div></div>
                            <div class="stat-card"><i class="fas fa-file-alt" style="font-size: 32px; margin-bottom: 10px;"></i><div class="stat-number">${stats.totalLfgPosts || 0}</div><div class="stat-label">Активных анкет</div></div>
                            <div class="stat-card"><i class="fas fa-trophy" style="font-size: 32px; margin-bottom: 10px;"></i><div class="stat-number">${stats.totalTournaments || 0}</div><div class="stat-label">Турниров</div></div>
                            <div class="stat-card"><i class="fas fa-server" style="font-size: 32px; margin-bottom: 10px;"></i><div class="stat-number">8</div><div class="stat-label">Серверов</div></div>
                        </div>
                        
                        <div class="card" style="margin-bottom: 30px;">
                            <h2 class="text-green" style="margin-bottom: 20px;">🎮 Игровые серверы</h2>
                            <div style="display: grid; gap: 15px;">
                                <div class="flex" style="justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 12px;">
                                    <div><strong>BARSIDE DM #1</strong><p class="text-gray" style="font-size: 12px;">Deathmatch • de_dust2</p></div>
                                    <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="window.open('steam://connect/62.122.214.244:27015')">Играть</button>
                                </div>
                                <div class="flex" style="justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 12px;">
                                    <div><strong>BARSIDE 5x5 #1</strong><p class="text-gray" style="font-size: 12px;">Competitive • de_mirage</p></div>
                                    <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="window.open('steam://connect/45.92.38.55:28031')">Играть</button>
                                </div>
                                <div class="flex" style="justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 12px;">
                                    <div><strong>BARSIDE 2x2 #1</strong><p class="text-gray" style="font-size: 12px;">Wingman • de_inferno</p></div>
                                    <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="window.open('steam://connect/91.103.255.168:28029')">Играть</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="card" style="text-align: center;">
                            <h2 class="text-green">Готов к соревнованиям?</h2>
                            <p class="text-gray" style="margin-bottom: 20px;">Присоединяйся к турнирам, находи тиммейтов и повышай свой скилл</p>
                            <div class="flex" style="justify-content: center; gap: 15px;">
                                ${currentUser ? '<button class="btn btn-primary" onclick="navigate(\'tournaments\')">🏆 Участвовать</button>' : '<a href="/api/auth/steam" class="btn btn-primary"><i class="fab fa-steam"></i> Войти через Steam</a>'}
                            </div>
                        </div>
                    </div>
                `;
            } catch(e) {
                return '<div class="container"><div class="card text-center">Ошибка загрузки</div></div>';
            }
        }

        // ==================== СТРАНИЦА LFG ====================
        async function renderLfgPage() {
            try {
                const [activeRes, completedRes] = await Promise.all([
                    api.get('/lfg'),
                    api.get('/lfg/completed')
                ]);
                const posts = activeRes.data.data || [];
                const completedPosts = completedRes.data.data || [];
                postsCache = posts;
                
                let postsHtml = '';
                for (const post of posts) {
                    const isAuthor = currentUser?.id === post.authorId;
                    const rolesNeeded = post.rolesNeeded || {};
                    const rolesList = Object.keys(rolesNeeded).filter(r => rolesNeeded[r]);
                    
                    postsHtml += `
                        <div class="lfg-card">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
                                <div style="display: flex; gap: 12px; align-items: center; cursor: pointer;" onclick="navigate('profile', { id: '${post.author?.steamId}' })">
                                    <img src="${post.author?.steamAvatar}" style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--primary);">
                                    <div>
                                        <h3>${escapeHtml(post.title)}</h3>
                                        <p class="text-gray" style="font-size: 11px;">${escapeHtml(post.author?.displayName || post.author?.steamNickname)}</p>
                                    </div>
                                </div>
                                <div class="status-badge status-upcoming">Ищет ${post.playersNeeded} игроков</div>
                            </div>
                            
                            <div class="flex" style="gap: 10px; margin-bottom: 12px; flex-wrap: wrap; font-size: 12px;">
                                <span>${post.region === 'RU' ? '🇷🇺 Россия' : '🌏 Другой'}</span>
                                <span>🎭 <span class="role-badge role-${post.myRole}">${post.myRole}</span></span>
                                <span>📈 ${post.minFaceitLevel}+ FaceIt</span>
                                <span>🗣️ ${post.language === 'ru' ? '🇷🇺 Русский' : '🇬🇧 English'}</span>
                            </div>
                            
                            <div style="margin-bottom: 12px;">
                                <p class="text-gray" style="font-size: 12px;">📅 ${escapeHtml(post.schedule)}</p>
                                ${rolesList.length > 0 ? `<p class="text-gray" style="font-size: 12px;">🎮 Нужны роли: ${rolesList.map(r => `<span class="role-badge role-${r}" style="margin-right: 5px;">${r}</span>`).join('')}</p>` : ''}
                            </div>
                            
                            ${post.description ? `<p class="text-gray" style="font-size: 13px; margin-bottom: 12px; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 8px;">${escapeHtml(post.description)}</p>` : ''}
                            
                            <div style="display: flex; gap: 8px; margin-top: 12px;">
                                ${!isAuthor && currentUser ? `<button class="btn btn-primary" style="flex: 1;" onclick="showRespondModal('${post.id}', ${JSON.stringify(rolesList)})">📝 Откликнуться</button>` : ''}
                                ${!currentUser ? `<button class="btn btn-primary" style="flex: 1;" onclick="showToast('Войдите через Steam', 'info')">Войдите, чтобы откликнуться</button>` : ''}
                                ${isAuthor ? `<button class="btn btn-outline" style="flex: 1;" onclick="deleteLfgPost('${post.id}')">🗑 Удалить</button>` : ''}
                            </div>
                        </div>
                    `;
                }
                
                let completedHtml = '';
                for (const post of completedPosts) {
                    completedHtml += `
                        <div class="lfg-card" style="opacity: 0.9;">
                            <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 15px; cursor: pointer;" onclick="navigate('profile', { id: '${post.author?.steamId}' })">
                                <img src="${post.author?.steamAvatar}" style="width: 48px; height: 48px; border-radius: 50%;">
                                <div>
                                    <h3>${escapeHtml(post.title)}</h3>
                                    <p class="text-gray" style="font-size: 11px;">${escapeHtml(post.author?.displayName || post.author?.steamNickname)}</p>
                                </div>
                            </div>
                            <div class="flex" style="gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">

        window.showFriendsTab = function(tab) {
            const friendsTab = document.getElementById('friends-tab-friends');
            const requestsTab = document.getElementById('friends-tab-requests');
            const sentTab = document.getElementById('friends-tab-sent');
            const btns = document.querySelectorAll('.flex button');
            
            friendsTab.style.display = 'none';
            requestsTab.style.display = 'none';
            sentTab.style.display = 'none';
            
            if (tab === 'friends') {
                friendsTab.style.display = 'block';
                btns[0].className = 'btn btn-primary';
                btns[1].className = 'btn btn-outline';
                btns[2].className = 'btn btn-outline';
            } else if (tab === 'requests') {
                requestsTab.style.display = 'block';
                btns[0].className = 'btn btn-outline';
                btns[1].className = 'btn btn-primary';
                btns[2].className = 'btn btn-outline';
            } else {
                sentTab.style.display = 'block';
                btns[0].className = 'btn btn-outline';
                btns[1].className = 'btn btn-outline';
                btns[2].className = 'btn btn-primary';
            }
        };

                for (const u of users) {
                    usersHtml += `
                        <tr style="border-bottom: 1px solid #333; cursor: pointer;" onclick="navigate('profile', { id: '${u.steamId}' })">
                            <td style="padding: 10px;"><div style="display: flex; align-items: center; gap: 8px;"><img src="${u.steamAvatar}" style="width: 28px; height: 28px; border-radius: 50%;">${escapeHtml(u.displayName || u.steamNickname)}</div></td>
                            <td style="padding: 10px;">${u.balance} ₽</td>
                            <td style="padding: 10px;">${u.isAdmin ? '👑 Админ' : '👤 Пользователь'}</td>
                            <td style="padding: 10px;">${u.isBanned ? '🔴 Забанен' : '🟢 Активен'}</td>
                        </tr>
                    `;
                }
                return `
                    <div class="container">
                        <h1 style="font-size: 28px; margin-bottom: 20px;">👑 Админ-панель</h1>
                        <div class="card">
                            <h2 class="text-green">Все пользователи</h2>
                            <div style="overflow-x: auto; margin-top: 15px;">
                                <table style="width: 100%; font-size: 13px;">
                                    <thead><tr style="border-bottom: 1px solid #333;"><th style="padding: 8px; text-align: left;">Ник</th><th style="padding: 8px; text-align: left;">Баланс</th><th style="padding: 8px; text-align: left;">Статус</th><th style="padding: 8px; text-align: left;">Бан</th></tr></thead>
                                    <tbody>${usersHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            } catch(e) {
                return '<div class="container"><div class="card text-center">Ошибка загрузки</div></div>';
            }
        }

        // ==================== ПРИВЯЗКА СОБЫТИЙ ====================
        function attachEventListeners() {
            document.querySelectorAll('[data-page]').forEach(el => {
                el.removeEventListener('click', handleNavClick);
                el.addEventListener('click', handleNavClick);
            });
            
            const chatForm = document.getElementById('chat-form');
            if (chatForm) {
                chatForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const input = document.getElementById('chat-input');
                    const text = input.value.trim();
                    if (!text) return;
                    const userId = currentPage.split('/chat/')[1];
                    try {
                        await api.post(`/messages/${userId}`, { text });
                        input.value = '';
                        renderPage();
                    } catch(err) {
                        showToast('Ошибка отправки', 'error');
                    }
                };
            }
            
            // Обновление чата каждые 3 секунды
            if (currentPage.startsWith('chat/')) {
                setInterval(() => {
                    if (currentPage.startsWith('chat/')) renderPage();
                }, 3000);
            }
        }

        function handleNavClick(e) {
            e.preventDefault();
            const page = this.getAttribute('data-page');
            if (page === 'profile') {
                const steamId = this.getAttribute('data-steamid');
                navigate(page, { id: steamId });
            } else {
                navigate(page);
            }
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        async function init() {
            await loadAuth();
            updateOnlineCount();
            sendHeartbeat();
            
            setInterval(updateOnlineCount, 30000);
            setInterval(sendHeartbeat, 30000);
            setInterval(() => { if (currentUser) loadUnreadCounts(); }, 10000);
            
            window.addEventListener('popstate', () => {
                const path = window.location.pathname.slice(1) || 'home';
                currentPage = path;
                renderPage();
            });
            
            const initialPath = window.location.pathname.slice(1) || 'home';
            currentPage = initialPath;
            renderPage();
        }
        
        init();
    </script>
</body>
</html>
