        // ============= КОНФИГУРАЦИЯ =============
        const api = axios.create({
            baseURL: 'https://barside-api.onrender.com/api',

        // ============= КАСТОМНЫЕ УВЕДОМЛЕНИЯ =============
        function showToast(message, type = 'success', title = '') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const titles = { success: '✅ Успешно', error: '❌ Ошибка', info: 'ℹ️ Информация' };
            const icons = { success: '✓', error: '✕', info: 'i' };
            
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <div class="toast-icon">${icons[type] || '✓'}</div>
                <div class="toast-content">
                    <div class="toast-title">${title || titles[type]}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close">✕</button>
            `;
            
            container.appendChild(toast);
            
            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.onclick = () => {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            };
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.style.animation = 'slideOutRight 0.3s ease forwards';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        function customConfirm(message) {
            return new Promise((resolve) => {
                const modalOverlay = document.createElement('div');
                modalOverlay.className = 'modal-overlay';
                modalOverlay.style.zIndex = '10000';
                modalOverlay.innerHTML = `
                    <div class="modal-content" style="max-width: 400px;">
                        <div class="modal-header">
                            <h2 class="text-green">Подтверждение</h2>
                            <button class="modal-close" id="confirm-close">✕</button>
                        </div>
                        <p style="margin-bottom: 25px; color: #ccc;">${message}</p>
                        <div class="flex" style="justify-content: flex-end; gap: 12px;">
                            <button id="confirm-cancel" class="btn" style="background: #555;">Отмена</button>
                            <button id="confirm-ok" class="btn btn-green">Да, подтверждаю</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modalOverlay);
                
                const closeModal = () => {
                    modalOverlay.style.animation = 'fadeOut 0.2s ease';
                    setTimeout(() => modalOverlay.remove(), 200);
                };
                
                modalOverlay.querySelector('#confirm-close').onclick = () => { resolve(false); closeModal(); };
                modalOverlay.querySelector('#confirm-cancel').onclick = () => { resolve(false); closeModal(); };
                modalOverlay.querySelector('#confirm-ok').onclick = () => { resolve(true); closeModal(); };
                modalOverlay.onclick = (e) => { if (e.target === modalOverlay) { resolve(false); closeModal(); } };
            });
        }
        
        // ============= ХУКИ =============
        function useAuth() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            
            React.useEffect(() => {
                api.get('/auth/me')
                    .then(res => setUser(res.data.data))
                    .catch(() => setUser(null))
                    .finally(() => setLoading(false));
            }, []);
            
            const logout = () => {
                api.post('/auth/logout').then(() => {
                    setUser(null);
                    window.location.href = '/';
                });
            };
            
            return { user, loading, logout, refetch: () => api.get('/auth/me').then(res => setUser(res.data.data)) };
        }
        
        function useOnline() {
            const [count, setCount] = React.useState(0);
            
            React.useEffect(() => {
                const fetchCount = () => api.get('/online').then(res => setCount(res.data.count)).catch(console.error);
                fetchCount();
                const interval = setInterval(fetchCount, 30000);
                return () => clearInterval(interval);
            }, []);
            
            React.useEffect(() => {
                let sessionId = sessionStorage.getItem('sessionId');
                if (!sessionId) {
                    sessionId = crypto.randomUUID();
                    sessionStorage.setItem('sessionId', sessionId);
                }
                api.post('/heartbeat', { sessionId }).catch(console.error);
                const interval = setInterval(() => api.post('/heartbeat', { sessionId }).catch(console.error), 30000);
                return () => clearInterval(interval);
            }, []);
            
            return count;
        }

            const [loading, setLoading] = React.useState(true);
            const messagesEndRef = React.useRef(null);
            
            React.useEffect(() => {
                if (!user || !userId) return;
                api.get(`/user/by-id/${userId}`).then(res => setChatUser(res.data.user)).catch(() => setChatUser(null));
                api.get(`/messages/${userId}`).then(res => { setMessages(res.data.data || []); setLoading(false); }).catch(() => setLoading(false));
            }, [userId, user]);
            
            React.useEffect(() => {
                const interval = setInterval(() => { if (userId) api.get(`/messages/${userId}`).then(res => setMessages(res.data.data || [])).catch(console.error); }, 3000);
                return () => clearInterval(interval);
            }, [userId]);
            
            const sendMessage = async (e) => {
                e.preventDefault();
                if (!newMessage.trim()) return;
                try {
                    await api.post(`/messages/${userId}`, { text: newMessage });
                    setNewMessage('');
                    const res = await api.get(`/messages/${userId}`);
                    setMessages(res.data.data || []);
                } catch (err) { showToast('Ошибка отправки', 'error'); }
            };
            
            if (loading) return React.createElement('div', { className: 'text-center', style: { padding: '50px' } }, 'Загрузка...');
            if (!chatUser) return React.createElement('div', { className: 'text-center', style: { padding: '50px' } }, 'Пользователь не найден');
            
            return React.createElement('div', { className: 'container', style: { maxWidth: '800px', margin: '0 auto' } },
                React.createElement('div', { className: 'card', style: { marginBottom: '20px', display: 'flex', alignItems: 'center', gap: '15px' } },
                    React.createElement('button', { onClick: () => navigate('/friends'), className: 'btn', style: { background: '#555' } }, '← Назад'),
                    React.createElement('img', { src: chatUser.steamAvatar, style: { width: '48px', height: '48px', borderRadius: '50%' } }),
                    React.createElement('h3', null, chatUser.displayName || chatUser.steamNickname)
                ),
                React.createElement('div', { className: 'card', style: { height: '450px', display: 'flex', flexDirection: 'column' } },
                    React.createElement('div', { style: { flex: 1, overflowY: 'auto', padding: '16px' } },
                        messages.length === 0 ? React.createElement('div', { className: 'text-center', style: { padding: '40px' } }, 'Нет сообщений') :
                        messages.map(msg => {
                            const isOwn = msg.fromId === user?.id;
                            return React.createElement('div', { key: msg.id, style: { textAlign: isOwn ? 'right' : 'left', marginBottom: '10px' } },
                                React.createElement('div', { style: { display: 'inline-block', background: isOwn ? 'var(--primary)' : 'rgba(255,255,255,0.1)', padding: '8px 12px', borderRadius: '12px', maxWidth: '70%' } },
                                    React.createElement('p', { style: { fontSize: '14px' } }, msg.text),
                                    React.createElement('p', { style: { fontSize: '10px', opacity: 0.6 } }, new Date(msg.createdAt).toLocaleTimeString())
                                )
                            );
                        }),
                        React.createElement('div', { ref: messagesEndRef })
                    ),
                    React.createElement('form', { onSubmit: sendMessage, style: { display: 'flex', gap: '10px', padding: '12px', borderTop: '1px solid rgba(76,0,255,0.2)' } },
                        React.createElement('input', { type: 'text', value: newMessage, onChange: (e) => setNewMessage(e.target.value), placeholder: 'Сообщение...', className: 'form-input', style: { flex: 1 } }),
                        React.createElement('button', { type: 'submit', className: 'btn btn-primary' }, '📤')
                    )
                )
            );
        }
        
        // ============= СТРАНИЦА ТУРНИРОВ =============
        function TournamentsPage({ navigate }) {
            const { user } = useAuth();
            const [tournaments, setTournaments] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [selectedTournament, setSelectedTournament] = React.useState(null);
            
            React.useEffect(() => {
                api.get('/tournaments').then(res => { setTournaments(res.data.data || []); setLoading(false); }).catch(() => setLoading(false));
            }, []);
            
            if (loading) return React.createElement('div', { className: 'text-center', style: { padding: '50px' } }, 'Загрузка...');
            
            return React.createElement('div', { className: 'container' },
                React.createElement('h1', { style: { fontSize: '32px', marginBottom: '20px' } }, '🏆 Турниры CS2'),
                tournaments.length === 0 ? React.createElement('div', { className: 'card text-center' }, 'Нет турниров') :
                React.createElement('div', { className: 'tournaments-grid' },
                    tournaments.map(t => React.createElement('div', { key: t.id, className: 'tournament-card', onClick: () => setSelectedTournament(t) },
                        React.createElement('h3', { style: { color: '#4caf50' } }, t.title),
                        React.createElement('div', { className: 'prize' }, `💰 ${t.prizePool}`),
                        React.createElement('p', null, `📅 ${new Date(t.date).toLocaleDateString('ru-RU')}`),
                        React.createElement('button', { className: 'btn btn-primary', style: { marginTop: '15px', width: '100%' } }, 'Подробнее')
                    ))
                ),
                selectedTournament && React.createElement('div', { className: 'modal-overlay', onClick: () => setSelectedTournament(null) },
                    React.createElement('div', { className: 'modal-content', onClick: (e) => e.stopPropagation() },
                        React.createElement('div', { className: 'modal-header' },
                            React.createElement('h2', { className: 'text-green' }, selectedTournament.title),
                            React.createElement('button', { className: 'modal-close', onClick: () => setSelectedTournament(null) }, '✕')
                        ),
                        React.createElement('div', { className: 'prize', style: { textAlign: 'center' } }, `🏆 ${selectedTournament.prizePool}`),
                        React.createElement('p', null, `📅 Дата: ${new Date(selectedTournament.date).toLocaleString('ru-RU')}`),
                        React.createElement('p', null, `👥 Формат: ${selectedTournament.format}`),
                        React.createElement('p', null, `💰 Взнос: ${selectedTournament.entryFee} ₽`),
                        selectedTournament.description && React.createElement('p', { className: 'text-gray', style: { marginTop: '15px' } }, selectedTournament.description),
                        React.createElement('button', { onClick: () => showToast('Функция в разработке', 'info'), className: 'btn btn-primary', style: { width: '100%', marginTop: '20px' } }, 'Зарегистрировать команду')
                    )
                )
            );
        }
        
        // ============= АДМИН ПАНЕЛЬ =============
        function AdminPanel({ navigate }) {
            const { user } = useAuth();
            const [users, setUsers] = React.useState([]);
            const [bannedUsers, setBannedUsers] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [searchResults, setSearchResults] = React.useState([]);
            const [banUserId, setBanUserId] = React.useState('');
            const [banReason, setBanReason] = React.useState('');
            const [banDuration, setBanDuration] = React.useState('');
            const [banDurationUnit, setBanDurationUnit] = React.useState('hours');
            
            const loadBannedUsers = async () => {
                try {
                    const res = await api.get('/admin/banned-users');
                    setBannedUsers(res.data.data || []);
                } catch (err) { 
                    showToast('Ошибка загрузки банов', 'error'); 
                }
            };
            
            React.useEffect(() => {
                if (user?.isAdmin) {
                    api.get('/admin/users').then(res => setUsers(res.data.data || [])).catch(console.error);
                    loadBannedUsers();
                }
            }, [user]);
            
            const handleSearch = async () => {
                if (!searchQuery.trim()) { 
                    setSearchResults([]); 
                    return; 
                }
                try {
                    const res = await api.get(`/admin/search?query=${encodeURIComponent(searchQuery)}`);
                    setSearchResults(res.data.data || []);
                } catch (err) { 
                    showToast('Ошибка поиска', 'error'); 
                }
            };
            
            const handleBan = async () => {
                if (!banUserId || !banReason) { 
                    showToast('Заполните ID и причину', 'error'); 
                    return; 
                }
                let durationMinutes = null;
                if (banDuration) {
                    const num = parseInt(banDuration);
                    if (banDurationUnit === 'minutes') durationMinutes = num;
                    else if (banDurationUnit === 'hours') durationMinutes = num * 60;
                    else if (banDurationUnit === 'days') durationMinutes = num * 1440;
                }
                try {
                    await api.post('/admin/ban', { userId: banUserId, reason: banReason, durationMinutes });
                    showToast('Пользователь забанен', 'success');
                    setBanUserId('');
                    setBanReason('');
                    setBanDuration('');
                    loadBannedUsers();
                } catch (err) { 
                    showToast('Ошибка бана', 'error'); 
                }
            };
            
            const handleUnban = async (userId) => {
                if (await customConfirm('Разбанить пользователя?')) {
                    try {
                        await api.post(`/admin/unban/${userId}`);
                        showToast('Пользователь разбанен', 'success');
                        loadBannedUsers();
                    } catch (err) { 
                        showToast('Ошибка', 'error'); 
                    }
                }
            };
            
            if (!user?.isAdmin) return React.createElement('div', { className: 'text-center', style: { padding: '50px' } }, 'Доступ запрещён');
            
            return React.createElement('div', { className: 'container' },
                React.createElement('h1', { style: { fontSize: '32px', marginBottom: '20px' } }, '👑 Админ-панель'),
                
                // Поиск пользователей
                React.createElement('div', { className: 'card', style: { marginBottom: '30px' } },
                    React.createElement('h3', { className: 'text-green' }, '🔍 Поиск пользователей'),
                    React.createElement('div', { className: 'flex', style: { gap: '10px', marginTop: '10px' } },
                        React.createElement('input', { type: 'text', className: 'form-input', style: { flex: 1 }, value: searchQuery, onChange: (e) => setSearchQuery(e.target.value), placeholder: 'Поиск по нику...', onKeyPress: (e) => e.key === 'Enter' && handleSearch() }),
                        React.createElement('button', { onClick: handleSearch, className: 'btn btn-primary' }, 'Найти')
                    ),
                    searchResults.length > 0 && React.createElement('div', { style: { marginTop: '20px' } },
                        searchResults.map(foundUser => React.createElement('div', { key: foundUser.id, className: 'card', style: { marginBottom: '15px', cursor: 'pointer' }, onClick: () => navigate(`/profile/${foundUser.steamId}`) },
                            React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '15px' } },
                                React.createElement('img', { src: foundUser.steamAvatar, style: { width: '50px', height: '50px', borderRadius: '50%' } }),
                                React.createElement('div', { style: { flex: 1 } },
                                    React.createElement('h3', null, foundUser.displayName || foundUser.steamNickname),
                                    React.createElement('p', { className: 'text-gray' }, `Баланс: ${foundUser.balance} ₽ | ${foundUser.isBanned ? '🔴 Забанен' : '🟢 Активен'}`)
                                ),
                                React.createElement('button', { onClick: (e) => { e.stopPropagation(); navigate(`/profile/${foundUser.steamId}`); }, className: 'btn btn-primary' }, 'Ред.')
                            )
                        ))
                    )
                ),
                
                // Забанить пользователя
                React.createElement('div', { className: 'card', style: { marginBottom: '30px' } },
                    React.createElement('h2', { className: 'text-green', style: { marginBottom: '15px' } }, '🔨 Забанить пользователя'),
                    React.createElement('div', { className: 'grid-2' },
                        React.createElement('div', { className: 'form-group' },
                            React.createElement('label', null, 'ID пользователя'),
                            React.createElement('input', { className: 'form-input', value: banUserId, onChange: (e) => setBanUserId(e.target.value), placeholder: 'user_...' })
                        ),
                        React.createElement('div', { className: 'form-group' },
                            React.createElement('label', null, 'Причина'),
                            React.createElement('input', { className: 'form-input', value: banReason, onChange: (e) => setBanReason(e.target.value), placeholder: 'Нарушение правил' })
                        ),
                        React.createElement('div', { className: 'form-group' },
                            React.createElement('label', null, 'Длительность'),
                            React.createElement('div', { style: { display: 'flex', gap: '8px' } },
                                React.createElement('input', { type: 'number', className: 'form-input', value: banDuration, onChange: (e) => setBanDuration(e.target.value), placeholder: 'Количество', style: { flex: 2 } }),
                                React.createElement('select', { className: 'form-input', value: banDurationUnit, onChange: (e) => setBanDurationUnit(e.target.value), style: { flex: 1 } },
                                    React.createElement('option', { value: 'minutes' }, 'Минуты'),
                                    React.createElement('option', { value: 'hours' }, 'Часы'),
                                    React.createElement('option', { value: 'days' }, 'Дни')
                                )
                            )
                        )
                    ),
                    React.createElement('button', { onClick: handleBan, className: 'btn btn-danger', style: { marginTop: '10px', width: '100%' } }, 'Забанить пользователя')
                ),
                
                // Список забаненных
                React.createElement('div', { className: 'card', style: { marginBottom: '30px' } },
                    React.createElement('h2', { className: 'text-green', style: { marginBottom: '15px' } }, '⛔ Забаненные пользователи'),
                    bannedUsers.length === 0 ? React.createElement('p', { className: 'text-gray' }, 'Нет забаненных пользователей') :
                    React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
                        bannedUsers.map(bu => React.createElement('div', { key: bu.userId, style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px', background: 'rgba(255,255,255,0.03)', borderRadius: '8px' } },
                            React.createElement('div', null,
                                React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
                                    React.createElement('img', { src: bu.steamAvatar, style: { width: '30px', height: '30px', borderRadius: '50%' } }),
                                    React.createElement('strong', null, bu.displayName || bu.steamNickname)
                                ),
                                React.createElement('p', { className: 'text-gray', style: { fontSize: '12px' } }, `Причина: ${bu.reason}`),
                                bu.bannedUntil && React.createElement('p', { className: 'text-muted', style: { fontSize: '11px' } }, `До: ${new Date(bu.bannedUntil).toLocaleString()}`)
                            ),
                            React.createElement('button', { onClick: () => handleUnban(bu.userId), className: 'btn', style: { background: '#4caf50', padding: '6px 12px' } }, 'Разбанить')
                        ))
                    )
                ),
                
                // Все пользователи
                React.createElement('div', { className: 'card' },
                    React.createElement('h2', { className: 'text-green' }, 'Все пользователи'),
                    React.createElement('div', { style: { overflowX: 'auto', marginTop: '15px' } },
                        React.createElement('table', { style: { width: '100%' } },
                            React.createElement('thead', null,
                                React.createElement('tr', { style: { borderBottom: '1px solid #333' } },
                                    React.createElement('th', { style: { padding: '10px', textAlign: 'left' } }, 'Ник'),
                                    React.createElement('th', { style: { padding: '10px', textAlign: 'left' } }, 'Баланс'),
                                    React.createElement('th', { style: { padding: '10px', textAlign: 'left' } }, 'Статус')
                                )
                            ),
                            React.createElement('tbody', null,
                                users.map(u => React.createElement('tr', { key: u.id, style: { borderBottom: '1px solid #333', cursor: 'pointer' }, onClick: () => navigate(`/profile/${u.steamId}`) },
                                    React.createElement('td', { style: { padding: '10px' } }, React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } }, React.createElement('img', { src: u.steamAvatar, style: { width: '30px', height: '30px', borderRadius: '50%' } }), u.displayName || u.steamNickname)),
                                    React.createElement('td', { style: { padding: '10px' } }, `${u.balance} ₽`),
                                    React.createElement('td', { style: { padding: '10px' } }, u.isBanned ? '🔴 Забанен' : '🟢 Активен')
                                ))
                            )
                        )
                    )
                )
            );
        }
        // ============= ГЛАВНОЕ ПРИЛОЖЕНИЕ =============
        function App() {
            const [currentPath, setCurrentPath] = React.useState(window.location.pathname);
            
            React.useEffect(() => {
                const handleLocation = () => setCurrentPath(window.location.pathname);
                window.addEventListener('popstate', handleLocation);
                return () => window.removeEventListener('popstate', handleLocation);
            }, []);
            
            const navigate = (path) => {
                window.history.pushState({}, '', path);
                setCurrentPath(path);
            };
            
            let content;
            if (currentPath === '/lfg') {
                content = React.createElement(LfgPage, { navigate });
            } else if (currentPath === '/tournaments') {
                content = React.createElement(TournamentsPage, { navigate });
            } else if (currentPath.startsWith('/profile/')) {
                const steamId = currentPath.split('/profile/')[1];
                content = React.createElement(ProfilePage, { steamId, navigate });
            } else if (currentPath === '/admin') {
                content = React.createElement(AdminPanel, { navigate });
            } else if (currentPath === '/friends') {
                content = React.createElement(FriendsPage, { navigate });
            } else if (currentPath.startsWith('/chat/')) {
                const userId = currentPath.split('/chat/')[1];
                content = React.createElement(ChatPage, { userId, navigate });
            } else {
                content = React.createElement(HomePage, { navigate });
            }
            
            return React.createElement('div', null,
                React.createElement(Header, { currentPage: currentPath === '/' ? '/' : currentPath.startsWith('/profile') ? '/profile' : currentPath, navigate }),
                React.createElement('div', { style: { paddingTop: '40px' } },
                    content
                )
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App, null));
        console.log('✅ App rendered');
    </script>
</body>
</html>
