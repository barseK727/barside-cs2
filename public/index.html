            React.useEffect(() => { const handleLocation = () => setCurrentPath(window.location.pathname); window.addEventListener('popstate', handleLocation); return () => window.removeEventListener('popstate', handleLocation); }, []);
            const navigate = (path) => { window.history.pushState({}, '', path); setCurrentPath(path); };
            
            let content;
            if (currentPath === '/lfg') content = React.createElement(LfgPage, { navigate });
            else if (currentPath === '/tournaments') content = React.createElement(TournamentsPage, { navigate });
            else if (currentPath.startsWith('/profile/')) { const steamId = currentPath.split('/profile/')[1]; content = React.createElement(ProfilePage, { steamId, navigate }); }
            else if (currentPath === '/admin') content = React.createElement(AdminPanel, { navigate });
            else if (currentPath === '/friends') content = React.createElement(FriendsPage, { navigate });
            else if (currentPath.startsWith('/chat/')) { const userId = currentPath.split('/chat/')[1]; content = React.createElement(ChatPage, { userId, navigate }); }
            else content = React.createElement(HomePage, { navigate });
            
            return React.createElement('div', null, React.createElement(Header, { currentPage: currentPath === '/' ? '/' : currentPath.startsWith('/profile') ? '/profile' : currentPath, navigate }), React.createElement('div', { style: { paddingTop: '40px' } }, content));
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App, null));
        console.log('✅ App rendered');
    </script>
